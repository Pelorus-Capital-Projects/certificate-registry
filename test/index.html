/* =========================================================
   STORAGE HEALTH & PHOTO SIZE
   Saving "personal details" rewrites the WHOLE profile record. If that record
   carries a full-size photo (several MB), the write can be refused when the
   browser's storage allowance is tight, while tiny certificate records keep
   saving. So photos are shrunk to avatar size, and every save failure now
   says why instead of "something went wrong".
========================================================= */
const APP_VERSION = '2026-11-15a (login) · TEST';
const PHOTO_MAX_SIDE = 512;
const PHOTO_TARGET_MAX = 250 * 1024;          // a stored photo longer than this many characters gets shrunk
const PHOTO_UPLOAD_LIMIT = 25 * 1024 * 1024;  // the ORIGINAL may be large; only the shrunk copy is stored

async function storageEstimate(){
  try{
    if(navigator.storage && navigator.storage.estimate){
      const e = await navigator.storage.estimate();
      if(e && e.quota) return {usage: e.usage || 0, quota: e.quota};
    }
  }catch(e){ /* not available in this browser */ }
  return null;
}
async function saveFailureReason(){
  const err = lastStorageError;
  const est = await storageEstimate();
  const space = est ? ` (${formatBytes(est.usage)} used of the ${formatBytes(est.quota)} your browser allows)` : '';
  const name = (err && err.name) || '';
  if(name === 'QuotaExceededError'){
    return `Your browser has run out of storage space for this app${space}. Free up some storage on your ${DEVICE_NAME}, then try again. You can check this any time under Profile, Storage.`;
  }
  if(name === 'InvalidStateError' || name === 'TransactionInactiveError'){
    return "The browser closed this app's storage connection. Reload the page and try again; everything you saved earlier is safe.";
  }
  if(name === 'VersionError'){
    return "This app's storage was set up by a different copy of the app. Reload the page; if this message comes back, tell Claude the version number shown at the bottom of Profile.";
  }
  if(name === 'SecurityError' || name === 'NotAllowedError' || name === 'UnknownError'){
    return IS_HOSTED ? 'The browser is blocking storage for this page. If this is a private browsing window, open the app in a normal Safari tab or from its Home Screen icon.' : 'The browser is blocking storage for this page. Open the app with the launcher (an address starting with http://localhost), not by double-clicking the HTML file.';
  }
  if(name) return `The browser reported “${name}”${err.message ? ': ' + String(err.message).replace(/[.\s]+$/, '') : ''}. Reload the page and try again.`;
  return 'The browser could not write to storage. Reload the page and try again.';
}

/* ---------- Photos ---------- */
async function shrinkImageBlob(blob, maxSide, quality){
  const bmp = await createImageBitmap(blob);        // rejects if the browser can't decode the image
  try{
    const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width * scale));
    const h = Math.max(1, Math.round(bmp.height * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const g = canvas.getContext('2d');
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); // JPEG has no transparency
    g.drawImage(bmp, 0, 0, w, h);
    return canvas.toDataURL('image/jpeg', quality);
  }finally{
    if(bmp && bmp.close) bmp.close();
  }
}
async function smallPhotoFrom(blob){
  let url = await shrinkImageBlob(blob, PHOTO_MAX_SIDE, 0.85);
  if(url.length > PHOTO_TARGET_MAX) url = await shrinkImageBlob(blob, 320, 0.7);
  return url;
}
async function ensureSmallPhoto(profile){
  if(!profile || typeof profile.photo !== 'string' || profile.photo.length <= PHOTO_TARGET_MAX) return profile;
  try{
    const small = await smallPhotoFrom(dataURLToBlob(profile.photo));
    return small.length < profile.photo.length ? {...profile, photo: small} : profile;
  }catch(e){
    console.error('Could not shrink the stored photo', e);
    return profile;
  }
}
// A photo saved by an earlier version may be several MB. Shrink it once, quietly, when Profile opens.
async function maybeShrinkStoredPhoto(){
  const p = state.profile;
  if(!p || typeof p.photo !== 'string' || p.photo.length <= PHOTO_TARGET_MAX) return;
  const small = await ensureSmallPhoto(p);
  if(small === p) return;
  if(await saveProfile(small)){
    state.profile = small;
    if(state.screen === 'profile' && !state.modal) renderKeepingDraft();
  }
}

async function runStorageCheck(){
  if(state.storageBusy) return;
  state.storageBusy = true; state.storageCheck = null;
  refreshStoragePanel();
  const results = [];
  const probe = async (label, bytes) => {
    const key = '__storage_probe__';
    const payload = 'x'.repeat(bytes);
    const wrote = await setKey(key, payload);
    const err = wrote ? '' : ((lastStorageError && lastStorageError.name) || 'Error');
    let readBack = false;
    if(wrote) readBack = (await getKey(key)) === payload;
    await deleteKeySafe(key);
    results.push({label, ok: wrote && readBack, error: wrote && !readBack ? 'read-back mismatch' : err});
  };
  await probe('Small save (1 KB)', 1024);
  await probe('Large save (3 MB)', 3 * 1024 * 1024);
  state.storageInfo = await storageEstimate();
  state.storageCheck = results;
  state.storageBusy = false;
  refreshStoragePanel();
}

/* =========================================================
   DATE ENTRY (day / month / year) + KEEPING WHAT YOU'VE TYPED
   Dates are typed into three boxes and the cursor moves on by itself. Stored dates stay
   in the same internal form as before (YYYY-MM-DD), so nothing already saved changes.
========================================================= */
const MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DATE_ORDER = ['d', 'm', 'y'];

function partsFromIso(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  return m ? {d: m[3], m: m[2], y: m[1]} : {d: '', m: '', y: ''};
}
// Which strings can still become a real day / month / year as more digits are typed.
function isValidDatePrefix(part, s){
  if(part === 'd') return /^([0-3]|0[1-9]|[12]\d|3[01])?$/.test(s);
  if(part === 'm') return /^([01]|0[1-9]|1[0-2])?$/.test(s);
  return /^(1(9(\d(\d)?)?)?|2([01](\d(\d)?)?)?)?$/.test(s);   // years 1900 to 2199
}
// Clean what is in one box: digits only, and a digit that could never be part of a real date is dropped.
// A first digit that can only be a single-digit day (4-9) or month (2-9) is completed with a leading zero.
function sanitizeDatePart(part, raw){
  const max = part === 'y' ? 4 : 2;
  let out = '';
  for(const ch of String(raw || '').replace(/\D/g, '')){
    if(out.length === 0 && ((part === 'd' && ch >= '4') || (part === 'm' && ch >= '2'))){ out = '0' + ch; break; }
    if(isValidDatePrefix(part, out + ch)) out += ch;
    if(out.length >= max) break;
  }
  return {value: out, complete: out.length === max};
}
function composeDate(parts){
  const d = String(parts.d || '').trim(), m = String(parts.m || '').trim(), y = String(parts.y || '').trim();
  if(!d && !m && !y) return {status: 'empty', iso: ''};
  if(!d || !m || !y) return {status: 'incomplete', iso: ''};
  if(!/^\d{1,2}$/.test(d) || !/^\d{1,2}$/.test(m) || !/^\d{4}$/.test(y)) return {status: 'invalid', iso: ''};
  const D = +d, M = +m, Y = +y;
  // Typing is limited to sensible years (1900-2199, see isValidDatePrefix), but a date that is ALREADY stored must always
  // stay editable. Older builds allowed any year, and people used far-future placeholders (31/12/9999) for documents that never expire.
  if(Y < 1000 || M < 1 || M > 12 || D < 1 || D > 31) return {status: 'invalid', iso: ''};
  const dt = new Date(Date.UTC(Y, M - 1, D));
  if(dt.getUTCFullYear() !== Y || dt.getUTCMonth() !== M - 1 || dt.getUTCDate() !== D) return {status: 'invalid', iso: ''};   // e.g. 31 February
  return {status: 'ok', iso: `${y}-${String(M).padStart(2, '0')}-${String(D).padStart(2, '0')}`};
}
function parseDateText(text){
  const t = String(text || '').trim();
  let m = /^(\d{1,2})\s*[\/\-.\s]\s*(\d{1,2})\s*[\/\-.\s]\s*(\d{4})$/.exec(t);
  if(m) return {d: m[1].padStart(2, '0'), m: m[2].padStart(2, '0'), y: m[3]};
  m = /^(\d{4})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})$/.exec(t);
  if(m) return {d: m[3].padStart(2, '0'), m: m[2].padStart(2, '0'), y: m[1]};
  m = /^(\d{2})(\d{2})(\d{4})$/.exec(t);
  if(m) return {d: m[1], m: m[2], y: m[3]};
  return null;
}
function readDateParts(base){
  const val = p => { const el = document.getElementById(`${base}_${p}`); return el ? el.value : ''; };
  return {d: val('d'), m: val('m'), y: val('y')};
}
function setDateParts(base, parts){
  for(const p of DATE_ORDER){ const el = document.getElementById(`${base}_${p}`); if(el) el.value = parts[p] || ''; }
}

/* ---------- what the three boxes do ---------- */
function dateBox(el){ return {base: el.getAttribute('data-date'), part: el.getAttribute('data-part')}; }
function focusDatePart(base, part, caretAtEnd){
  const el = document.getElementById(`${base}_${part}`);
  if(!el) return;
  el.focus();
  if(caretAtEnd && el.setSelectionRange){ const n = el.value.length; el.setSelectionRange(n, n); }
}
function dateInput(el){
  markDirty();
  const {base, part} = dateBox(el);
  const res = sanitizeDatePart(part, el.value);
  if(el.value !== res.value) el.value = res.value;
  if(res.complete && part !== 'y') focusDatePart(base, DATE_ORDER[DATE_ORDER.indexOf(part) + 1]);   // day done -> month, month done -> year
}
function dateKey(e, el){
  if(e.ctrlKey || e.metaKey || e.altKey) return;                 // leave copy / paste / shortcuts alone
  const {base, part} = dateBox(el);
  const i = DATE_ORDER.indexOf(part), k = e.key;
  if(k === '/' || k === '-' || k === '.' || k === ',' || k === ' '){   // a separator finishes the box
    e.preventDefault();
    if(part !== 'y' && el.value){
      if(el.value.length === 1 && el.value !== '0') el.value = '0' + el.value;
      focusDatePart(base, DATE_ORDER[i + 1]);
    }
    return;
  }
  if(k === 'Backspace' && el.value === '' && i > 0){ e.preventDefault(); focusDatePart(base, DATE_ORDER[i - 1], true); return; }
  if(k === 'ArrowLeft' && el.selectionStart === 0 && el.selectionEnd === 0 && i > 0){ e.preventDefault(); focusDatePart(base, DATE_ORDER[i - 1], true); return; }
  if(k === 'ArrowRight' && i < 2 && el.selectionStart === el.value.length && el.selectionEnd === el.value.length){ e.preventDefault(); focusDatePart(base, DATE_ORDER[i + 1]); return; }
  if(k.length === 1 && /\D/.test(k)){ e.preventDefault(); return; }   // letters and symbols never go into a date
  if(k.length === 1){                                                  // a digit typed into an already-full box starts that box over
    const max = part === 'y' ? 4 : 2;
    if(el.value.length >= max && el.selectionStart === el.selectionEnd) el.value = '';
  }
}
function datePad(el){          // leaving a box with a single digit in it completes it (5 -> 05)
  const {part} = dateBox(el);
  if(part !== 'y' && el.value.length === 1 && el.value !== '0') el.value = '0' + el.value;
}
function datePaste(e, el){     // pasting a whole date (25/12/2026, 25-12-2026, 2026-12-25, 25122026) fills all three boxes
  const data = e.clipboardData || window.clipboardData;
  const parsed = parseDateText(data ? data.getData('text') : '');
  if(!parsed) return;          // anything else is pasted normally, then cleaned up to digits by dateInput
  e.preventDefault();
  const {base} = dateBox(el);
  setDateParts(base, parsed);
  markDirty();
  focusDatePart(base, 'y', true);
}
function renderDateField(base, label, mark, parts, errClass, hint){
  const ph = {d: 'DD', m: 'MM', y: 'YYYY'}, word = {d: 'day', m: 'month', y: 'year'};
  const boxes = DATE_ORDER.map((p, i) => `${i ? '<span class="date-sep">/</span>' : ''}<input class="input date-part${p === 'y' ? ' year' : ''}" id="${base}_${p}" data-date="${base}" data-part="${p}" inputmode="numeric" autocomplete="off" maxlength="${p === 'y' ? 4 : 2}" placeholder="${ph[p]}" aria-label="${esc(label)} ${word[p]}" value="${esc(parts[p] || '')}" oninput="dateInput(this)" onkeydown="dateKey(event,this)" onpaste="datePaste(event,this)" onfocus="this.select()" onmouseup="event.preventDefault()" onclick="this.select()" onblur="datePad(this)">`).join('');
  return `<div class="field"><label>${esc(label)} ${mark}</label><div class="date-field${errClass}" role="group" aria-label="${esc(label)}">${boxes}</div>${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
}
function focusFormField(field){
  const id = (field === 'cf_issue' || field === 'cf_expiry') ? field + '_d' : field;
  const el = document.getElementById(id);

function readCertFormValues(){

// Copy what is currently typed in the open form into the dialog's own state, so redrawing it brings it back.

/* =========================================================
   LOGIN + ENCRYPTION
   Everything this app stores is encrypted with a random 256-bit key (AES-GCM).
   That key is itself stored only in encrypted form, twice:
     - locked with your username + password
     - locked with the answer to your recovery question
   Without one of those, the stored data cannot be read. The key lives in memory
   only while the app is unlocked, and is dropped when it locks.
========================================================= */
const VAULT_KEY = '__vault';
const LOGIN_USER_KEY = '__login_user';
const KDF_ITERATIONS = 600000;                 // PBKDF2-SHA256, the current OWASP figure
const AUTO_LOCK_MS = 10 * 60 * 1000;           // lock after 10 minutes without use
const RECOVERY_QUESTIONS = [
  'Brand of first go kart championship chassis',
  'Name of your first boat',
  'Name of the first yacht you worked on',
  'Name of your first pet',
  'Make and model of your first car',
  'Name of the street you grew up on',
  "Your childhood best friend's first name",
];
let dataKey = null;                            // the unlocked key (non-extractable), or null when locked
let authBusy = false;
let authFailures = 0, authBlockedUntil = 0;
let lastActivity = Date.now();
let pendingResetSecret = null;                 // raw key bytes, held only between "answer accepted" and "new password saved"

const te = new TextEncoder(), td = new TextDecoder();
function toB64(buf){ const b = new Uint8Array(buf); let s = ''; for(let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function fromB64(s){ const bin = atob(s); const b = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return b; }
function randomBytes(n){ return crypto.getRandomValues(new Uint8Array(n)); }

function normUsername(u){ return String(u || '').normalize('NFKC').trim().toLowerCase(); }
// Answers are forgiving: not case-sensitive, and spaces / punctuation are ignored.
function normAnswer(a){ return String(a || '').normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]/gu, ''); }
function passwordSecret(username, password){ return 'user:' + normUsername(username) + '\npass:' + String(password); }
function answerSecret(answer){ return 'answer:' + normAnswer(answer); }

async function deriveKek(secret, saltB64, iterations){
  const base = await crypto.subtle.importKey('raw', te.encode(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt: fromB64(saltB64), iterations, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
}
async function sealSecret(rawKey, secret){
  const salt = toB64(randomBytes(16)), iv = randomBytes(12);
  const kek = await deriveKek(secret, salt, KDF_ITERATIONS);
  const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, kek, rawKey);
  return {salt, iv: toB64(iv), ct: toB64(ct), iter: KDF_ITERATIONS};
}
async function openSealed(sealed, secret){   // returns the raw key bytes, or null if the secret is wrong
  try{
    const kek = await deriveKek(secret, sealed.salt, sealed.iter || KDF_ITERATIONS);
    return new Uint8Array(await crypto.subtle.decrypt({name: 'AES-GCM', iv: fromB64(sealed.iv)}, kek, fromB64(sealed.ct)));
  }catch(e){ return null; }
}
async function importDataKey(raw){ return crypto.subtle.importKey('raw', raw, {name: 'AES-GCM'}, false, ['encrypt', 'decrypt']); }

async function encryptValue(plain){
  const iv = randomBytes(12);
  const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, dataKey, te.encode(String(plain)));
  return {enc: 1, iv, ct};
}
async function decryptValue(v){
  if(!dataKey) return null;
  try{ return td.decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: v.iv}, dataKey, v.ct)); }
  catch(e){ console.error('A stored record could not be decrypted.'); return null; }
}
const isEncrypted = v => !!(v && typeof v === 'object' && v.enc === 1 && v.iv && v.ct);

/* ---------- raw access to the vault record (never encrypted) ---------- */
async function readVault(){
  const raw = await rawGetKey(VAULT_KEY);
  if(!raw) return null;
  try{ const v = JSON.parse(raw); return (v && v.v === 1 && v.pw && v.rq) ? v : {corrupt: true}; }catch(e){ return {corrupt: true}; }
}

/* ---------- the gate: runs before anything else is loaded ---------- */
async function authGate(){
  const vault = await readVault();
  if(!vault){
    state.authExisting = 0;
    const legacy = await rawGetKey('certificates');   // data saved by a version of the app without a login
    if(typeof legacy === 'string'){ try{ state.authExisting = (JSON.parse(legacy) || []).length || 0; }catch(e){} }
    state.screen = 'authSetup';
  } else if(vault.corrupt){
    state.screen = 'authBroken';
  } else {
    state.authQuestion = vault.rq.question;
    state.screen = 'authLogin';
  }
  render();
  focusFirstAuthField();
}
function focusFirstAuthField(){ const el = document.querySelector('.auth-card input'); if(el) el.focus(); }

function authMessage(msg, kind){
  const el = document.getElementById('authError');
  if(el){ el.textContent = msg || ''; el.className = kind === 'ok' ? 'auth-ok' : 'error-text'; el.style.display = msg ? '' : 'none'; }
}
function authSetBusy(on, label){
  authBusy = on;
  const b = document.getElementById('authSubmit');
  if(b){ b.disabled = on; if(label) b.textContent = label; }
}
const fieldVal = id => { const el = document.getElementById(id); return el ? el.value : ''; };
function rateLimited(){
  const wait = Math.ceil((authBlockedUntil - Date.now()) / 1000);
  if(wait > 0){ authMessage(`Too many attempts. Try again in ${wait} seconds.`); return true; }
  return false;
}
function noteFailure(){ authFailures++; if(authFailures >= 5) authBlockedUntil = Date.now() + 30000 * Math.pow(2, Math.min(authFailures - 5, 4)); }

function chosenQuestion(prefix){
  const sel = fieldVal(prefix + 'q');
  return sel === '__custom' ? fieldVal(prefix + 'qcustom').trim() : sel;
}
function onQuestionChange(prefix){
  const box = document.getElementById(prefix + 'qcustomWrap');
  if(box) box.style.display = fieldVal(prefix + 'q') === '__custom' ? '' : 'none';
}
function validateRecovery(prefix){
  const q = chosenQuestion(prefix), a = fieldVal(prefix + 'a'), a2 = fieldVal(prefix + 'a2');
  if(!q || q.length < 5) return 'Choose a recovery question (or write your own, at least 5 characters).';
  if(normAnswer(a).length < 2) return 'Type an answer to your recovery question.';
  if(normAnswer(a) !== normAnswer(a2)) return "The two answers don't match.";
  return null;
}
function validateLogin(prefix){
  const u = normUsername(fieldVal(prefix + 'user')), p = fieldVal(prefix + 'pass'), p2 = fieldVal(prefix + 'pass2');
  if(u.length < 3) return 'Choose a username of at least 3 characters.';
  if(p.length < 8) return 'Choose a password of at least 8 characters.';
  if(p !== p2) return "The two passwords don't match.";
  return null;
}

/* ---------- first-time setup (also locks data saved by an older version) ---------- */
async function submitSetup(){
  if(authBusy) return;
  const problem = validateLogin('su_') || validateRecovery('su_');
  if(problem){ authMessage(problem); return; }
  authMessage(''); authSetBusy(true, 'Setting up…');
  try{
    const raw = randomBytes(32);
    const username = normUsername(fieldVal('su_user'));
    const vault = {v: 1, kdf: 'PBKDF2-SHA256/AES-GCM-256', created: new Date().toISOString(),
      pw: await sealSecret(raw, passwordSecret(username, fieldVal('su_pass'))),
      rq: {question: chosenQuestion('su_'), ...(await sealSecret(raw, answerSecret(fieldVal('su_a'))))}};
    dataKey = await importDataKey(raw);
    raw.fill(0);
    // Encrypt everything already stored, and write it together with the vault in ONE all-or-nothing step.
    const existing = await rawGetAll();
    const entries = [];
    for(const {key, value} of existing){
      if(key === VAULT_KEY || isEncrypted(value) || value === null || value === undefined) continue;
      entries.push({key, value: await encryptValue(value)});
    }
    entries.push({key: LOGIN_USER_KEY, value: await encryptValue(username)});
    entries.push({key: VAULT_KEY, value: JSON.stringify(vault)});
    await rawPutMany(entries);
    const check = await readVault();
    if(!check || check.corrupt) throw new Error('The login could not be saved.');
    state.authUser = username;
    await enterApp();
  }catch(err){
    console.error('Setup failed', err);
    dataKey = null;
    authSetBusy(false, 'Create login');
    authMessage("The login couldn't be saved, so nothing was changed. " + (await saveFailureReason()));
  }
}

/* ---------- unlock ---------- */
async function submitLogin(){
  if(authBusy || rateLimited()) return;
  const u = fieldVal('li_user'), p = fieldVal('li_pass');
  if(!u.trim() || !p){ authMessage('Enter your username and password.'); return; }
  authMessage(''); authSetBusy(true, 'Unlocking…');
  const vault = await readVault();
  const raw = vault && !vault.corrupt ? await openSealed(vault.pw, passwordSecret(u, p)) : null;
  if(!raw){
    noteFailure();
    authSetBusy(false, 'Unlock');
    const el = document.getElementById('li_pass'); if(el){ el.value = ''; el.focus(); }
    if(!rateLimited()) authMessage('Username or password is incorrect.');
    return;
  }
  dataKey = await importDataKey(raw); raw.fill(0);
  authFailures = 0;
  state.authUser = normUsername(u);
  await enterApp();
}

/* ---------- forgot username or password ---------- */
function openForgot(){ state.screen = 'authForgot'; render(); focusFirstAuthField(); }
function backToLogin(){ pendingResetSecret = null; state.screen = 'authLogin'; render(); focusFirstAuthField(); }
async function submitRecoveryAnswer(){
  if(authBusy || rateLimited()) return;
  if(normAnswer(fieldVal('fg_a')).length < 1){ authMessage('Type your answer.'); return; }
  authMessage(''); authSetBusy(true, 'Checking…');
  const vault = await readVault();
  const raw = vault && !vault.corrupt ? await openSealed(vault.rq, answerSecret(fieldVal('fg_a'))) : null;
  if(!raw){
    noteFailure(); authSetBusy(false, 'Continue');
    if(!rateLimited()) authMessage("That answer doesn't match.");
    return;
  }
  authFailures = 0; authBusy = false;
  pendingResetSecret = raw;
  state.screen = 'authReset'; render(); focusFirstAuthField();
}
async function submitNewLogin(){
  if(authBusy || !pendingResetSecret) return;
  const problem = validateLogin('rs_');
  if(problem){ authMessage(problem); return; }
  authMessage(''); authSetBusy(true, 'Saving…');
  try{
    const vault = await readVault();
    const username = normUsername(fieldVal('rs_user'));
    vault.pw = await sealSecret(pendingResetSecret, passwordSecret(username, fieldVal('rs_pass')));
    vault.updated = new Date().toISOString();
    dataKey = await importDataKey(pendingResetSecret);
    await rawPutMany([{key: VAULT_KEY, value: JSON.stringify(vault)}, {key: LOGIN_USER_KEY, value: await encryptValue(username)}]);
    pendingResetSecret.fill(0); pendingResetSecret = null;
    state.authUser = username;
    await enterApp();
  }catch(err){
    console.error('Reset failed', err);
    dataKey = null; authSetBusy(false, 'Save and unlock');
    authMessage("The new login couldn't be saved. Your old password still works. " + (await saveFailureReason()));
  }
}

/* ---------- after unlocking ---------- */
async function enterApp(){
  authBusy = false;
  lastActivity = Date.now();
  if(!state.authUser){ const u = await getKey(LOGIN_USER_KEY); if(u) state.authUser = u; }
  state.screen = 'loading'; render();
  await startApp();
}

/* ---------- locking ---------- */
function lockApp(){
  dataKey = null;
  state.certificates = []; state.profile = {}; state.modal = null;
  try{ sessionStorage.setItem('cr-locked-reason', 'manual'); }catch(e){}
  location.reload();   // the cleanest way to drop every decrypted value, open file and form from memory
}
function hasUnsavedProfileEdits(){
  if(!document.getElementById('pf_name')) return false;
  const saved = state.profile || {};
  return ['name', 'surname', 'contact', 'email', 'gender'].some(k => fieldVal('pf_' + k) !== (saved[k] || ''));
}
function requestLock(){
  if(modalDirty || hasUnsavedProfileEdits()){
    state.modal = {type: 'confirm', title: 'Lock with unsaved changes?', danger: true, confirmLabel: 'Lock anyway',
      message: "Something you've typed hasn't been saved yet. If you lock now, it will be lost.",
      onConfirm: () => lockApp()};
    render(); return;
  }
  lockApp();
}
function autoLockCheck(){
  if(!dataKey || state.backupBusy) return;
  if(Date.now() - lastActivity >= AUTO_LOCK_MS){
    try{ sessionStorage.setItem('cr-locked-reason', 'idle'); }catch(e){}
    dataKey = null; state.certificates = []; state.profile = {}; state.modal = null;
    location.reload();
  }
}
['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(ev => document.addEventListener(ev, () => { lastActivity = Date.now(); }, {passive: true, capture: true}));
setInterval(autoLockCheck, 15000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') autoLockCheck(); });
function lockedReasonText(){
  let r = null; try{ r = sessionStorage.getItem('cr-locked-reason'); sessionStorage.removeItem('cr-locked-reason'); }catch(e){}
  return r === 'idle' ? 'Locked after 10 minutes without use.' : (r === 'manual' ? 'Locked.' : '');
}

/* ---------- screens ---------- */
function questionPicker(prefix, current){
  const isCustom = current && !RECOVERY_QUESTIONS.includes(current);
  return `
    <div class="field">
      <label for="${prefix}q">Recovery question</label>
      <select class="input" id="${prefix}q" onchange="onQuestionChange('${prefix}')">
        ${RECOVERY_QUESTIONS.map(q => `<option value="${esc(q)}" ${q === current ? 'selected' : ''}>${esc(q)}</option>`).join('')}
        <option value="__custom" ${isCustom ? 'selected' : ''}>Write my own question…</option>
      </select>
    </div>
    <div class="field" id="${prefix}qcustomWrap" style="${isCustom ? '' : 'display:none;'}">
      <label for="${prefix}qcustom">Your question</label>
      <input class="input" id="${prefix}qcustom" maxlength="120" autocomplete="off" value="${isCustom ? esc(current) : ''}">
    </div>
    <div class="field">
      <label for="${prefix}a">Answer</label>
      <input class="input" id="${prefix}a" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="200">
    </div>
    <div class="field">
      <label for="${prefix}a2">Answer again</label>
      <input class="input" id="${prefix}a2" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="200">
      <div class="hint">Not case-sensitive, and spaces and punctuation are ignored, so “Blue Bird” and “bluebird” count as the same answer.</div>
    </div>`;
}
function loginFields(prefix, submitLabel){
  return `
    <div class="field">
      <label for="${prefix}user">Username</label>
      <input class="input" id="${prefix}user" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="60">
    </div>
    <div class="field">
      <label for="${prefix}pass">Password</label>
      <input class="input" id="${prefix}pass" type="password" autocomplete="new-password" maxlength="200">
      <div class="hint">At least 8 characters.</div>
    </div>
    <div class="field">
      <label for="${prefix}pass2">Password again</label>
      <input class="input" id="${prefix}pass2" type="password" autocomplete="new-password" maxlength="200">
    </div>
    <label class="auth-show"><input type="checkbox" onchange="togglePasswords(this.checked)"> Show password</label>`;
}
function togglePasswords(show){ document.querySelectorAll('.auth-card input[type=password], .auth-card input[data-pw]').forEach(el => { el.setAttribute('data-pw', '1'); el.type = show ? 'text' : 'password'; }); }
function authShell(inner){
  return `<div class="auth-shell"><div class="auth-card">
    <div class="auth-brand">${ICONS.seal}<span>Certificate Registry</span></div>
    ${inner}
  </div></div>`;
}
function renderAuthScreen(){
  const s = state.screen;
  if(s === 'authSetup'){
    const n = state.authExisting || 0;
    return authShell(`
      <h1 class="auth-title">Set up your login</h1>
      <p class="auth-sub">${n ? `Your ${plural(n, 'certificate')} on this device will be locked with this login and encrypted.` : 'Your certificates will be locked with this login and encrypted on this device.'}</p>
      <form onsubmit="event.preventDefault(); submitSetup();" autocomplete="on">
        ${loginFields('su_')}
        <div class="auth-divider"><span>If you forget your password</span></div>
        ${questionPicker('su_', RECOVERY_QUESTIONS[0])}
        <div class="auth-warn">This answer is the only other way back in. If you forget both your password and this answer, your data can only be brought back from a backup file.</div>
        <div id="authError" class="error-text" style="display:none;"></div>
        <button class="btn btn-primary auth-submit" id="authSubmit" type="submit">Create login</button>
      </form>`);
  }
  if(s === 'authLogin'){
    const reason = state.authReason || '';
    return authShell(`
      <h1 class="auth-title">Sign in</h1>
      ${reason ? `<p class="auth-sub">${esc(reason)}</p>` : '<p class="auth-sub">Enter your username and password to open your certificates.</p>'}
      <form onsubmit="event.preventDefault(); submitLogin();" autocomplete="on">
        <div class="field"><label for="li_user">Username</label><input class="input" id="li_user" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="60"></div>
        <div class="field"><label for="li_pass">Password</label><input class="input" id="li_pass" type="password" autocomplete="current-password" maxlength="200"></div>
        <label class="auth-show"><input type="checkbox" onchange="togglePasswords(this.checked)"> Show password</label>
        <div id="authError" class="error-text" style="display:none;"></div>
        <button class="btn btn-primary auth-submit" id="authSubmit" type="submit">Unlock</button>
      </form>
      <button class="btn-link auth-forgot" onclick="openForgot()">Forgot username or password?</button>`);
  }
  if(s === 'authForgot'){
    return authShell(`
      <h1 class="auth-title">Forgot username or password</h1>
      <p class="auth-sub">Answer your recovery question, then choose a new username and password.</p>
      <form onsubmit="event.preventDefault(); submitRecoveryAnswer();">
        <div class="auth-question">${esc(state.authQuestion || '')}</div>
        <div class="field"><label for="fg_a">Your answer</label><input class="input" id="fg_a" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="200"></div>
        <div id="authError" class="error-text" style="display:none;"></div>
        <button class="btn btn-primary auth-submit" id="authSubmit" type="submit">Continue</button>
      </form>
      <button class="btn-link auth-forgot" onclick="backToLogin()">Back to sign in</button>`);
  }
  if(s === 'authReset'){
    return authShell(`
      <h1 class="auth-title">Choose a new login</h1>
      <p class="auth-sub">Answer accepted. Choose a new username and password. Your recovery question stays the same.</p>
      <form onsubmit="event.preventDefault(); submitNewLogin();" autocomplete="on">
        ${loginFields('rs_')}
        <div id="authError" class="error-text" style="display:none;"></div>
        <button class="btn btn-primary auth-submit" id="authSubmit" type="submit">Save and unlock</button>
      </form>`);
  }
  // authBroken
  return authShell(`
    <h1 class="auth-title">Login data is damaged</h1>
    <p class="auth-sub">The record that holds your login on this device can't be read, so the encrypted data can't be opened. Nothing has been changed or deleted.</p>
    <p class="auth-sub">If you have a backup file, you can start again: erase this device's copy and set up a new login, then load the backup.</p>
    <button class="btn btn-danger auth-submit" onclick="startOverAfterDamage()">Erase this device's copy and start again</button>`);
}
async function startOverAfterDamage(){
  if(!confirmTyped()) return;
  try{ await rawDeleteAll(); }catch(e){}
  location.reload();
}
function confirmTyped(){ return window.confirm('This erases everything this app has stored on this device. Only continue if you have a backup file. Continue?'); }

/* ---------- Profile: Login & security panel ---------- */
function renderSecurityPanel(){
  return `
    <div class="panel">
      <div class="panel-head"><div><h2>Login & security</h2><div class="panel-sub">Signed in as <strong>${esc(state.authUser || '')}</strong></div></div></div>
      <p class="hint" style="margin-top:0;">Everything stored on this device is encrypted and unlocks only with your password or your recovery answer. The app locks itself after 10 minutes without use.</p>
      <div class="btn-row" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
        <button class="btn btn-ghost btn-sm" onclick="openChangeLogin()">Change username or password</button>
        <button class="btn btn-ghost btn-sm" onclick="openChangeRecovery()">Change recovery question</button>
        <button class="btn btn-ghost btn-sm" onclick="requestLock()">${ICONS.lock} Lock now</button>
      </div>
      <p class="hint">Backup files are not encrypted. Keep them somewhere private, such as your own iCloud Drive or Dropbox.</p>
    </div>`;
}
function openChangeLogin(){ authBusy = false; state.modal = {type: 'changeLogin', error: ''}; render(); }
function openChangeRecovery(){ authBusy = false; state.modal = {type: 'changeRecovery', error: ''}; render(); }
function renderSecurityModal(){
  const m = state.modal;
  if(m.type === 'changeLogin'){
    return modalShell(`
      <h2 class="modal-title">Change username or password</h2>
      <p class="modal-sub">Enter your current password, then the new login.</p>
      <div class="auth-card auth-inline">
        <div class="field"><label for="cl_cur">Current password</label><input class="input" id="cl_cur" type="password" autocomplete="current-password"></div>
        ${loginFields('cl_')}
      </div>
      <div id="authError" class="error-text" style="${m.error ? '' : 'display:none;'}">${esc(m.error || '')}</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="authSubmit" onclick="submitChangeLogin()">Save new login</button>
      </div>`);
  }
  const vq = state.authQuestion || RECOVERY_QUESTIONS[0];
  return modalShell(`
    <h2 class="modal-title">Change recovery question</h2>
    <p class="modal-sub">Enter your current password, then the new question and answer.</p>
    <div class="auth-card auth-inline">
      <div class="field"><label for="cr_cur">Current password</label><input class="input" id="cr_cur" type="password" autocomplete="current-password"></div>
      ${questionPicker('cr_', vq)}
    </div>
    <div id="authError" class="error-text" style="${m.error ? '' : 'display:none;'}">${esc(m.error || '')}</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="authSubmit" onclick="submitChangeRecovery()">Save recovery question</button>
    </div>`);
}
async function rawKeyFromCurrentPassword(curId){
  const vault = await readVault();
  if(!vault || vault.corrupt) return null;
  return openSealed(vault.pw, passwordSecret(state.authUser, fieldVal(curId)));
}
async function submitChangeLogin(){
  if(authBusy) return;
  const problem = validateLogin('cl_'); if(problem){ authMessage(problem); return; }
  authSetBusy(true, 'Saving…'); authMessage('');
  const raw = await rawKeyFromCurrentPassword('cl_cur');
  if(!raw){ authSetBusy(false, 'Save new login'); authMessage('Your current password is incorrect.'); return; }
  try{
    const vault = await readVault();
    const username = normUsername(fieldVal('cl_user'));
    vault.pw = await sealSecret(raw, passwordSecret(username, fieldVal('cl_pass'))); vault.updated = new Date().toISOString(); raw.fill(0);
    await rawPutMany([{key: VAULT_KEY, value: JSON.stringify(vault)}, {key: LOGIN_USER_KEY, value: await encryptValue(username)}]);
    authBusy = false; state.authUser = username; state.modal = null; modalDirty = false;
    state.backupMessage = null; render();
    showToastInSecurity('Your new username and password are saved. Use them next time you sign in.');
  }catch(err){ authSetBusy(false, 'Save new login'); authMessage("It couldn't be saved, so your old login still works. " + (await saveFailureReason())); }
}
async function submitChangeRecovery(){
  if(authBusy) return;
  const problem = validateRecovery('cr_'); if(problem){ authMessage(problem); return; }
  authSetBusy(true, 'Saving…'); authMessage('');
  const raw = await rawKeyFromCurrentPassword('cr_cur');
  if(!raw){ authSetBusy(false, 'Save recovery question'); authMessage('Your current password is incorrect.'); return; }
  try{
    const vault = await readVault();
    vault.rq = {question: chosenQuestion('cr_'), ...(await sealSecret(raw, answerSecret(fieldVal('cr_a'))))}; vault.updated = new Date().toISOString(); raw.fill(0);
    await rawPutMany([{key: VAULT_KEY, value: JSON.stringify(vault)}]);
    authBusy = false; state.authQuestion = vault.rq.question; state.modal = null; render();
    showToastInSecurity('Your new recovery question and answer are saved.');
  }catch(err){ authSetBusy(false, 'Save recovery question'); authMessage("It couldn't be saved, so your old answer still works. " + (await saveFailureReason())); }
}
function showToastInSecurity(text){
  const panel = [...document.querySelectorAll('.panel h2')].find(h => h.textContent === 'Login & security');
  if(!panel) return;
  const box = document.createElement('div'); box.className = 'backup-msg ok'; box.textContent = text; box.style.marginTop = '12px';
  panel.closest('.panel').appendChild(box);
}

async function startApp(){
  state.certificates = await loadCertificates();
  state.profile = await loadProfile();
  state.screen = 'dashboard';
  const dropboxReturn = await handleDropboxRedirect(); // only does anything when Dropbox has just sent the user back
  await refreshBackupExtras();
  if(dropboxReturn){
    previousScreen = 'dashboard';
    state.screen = 'profile';
    state.backupMessage = dropboxReturn.ok
      ? {type: 'ok', text: 'Dropbox is connected. You can now save backups to Dropbox and load them back.'}
      : {type: 'error', text: dropboxReturn.message};
  }
  render();
}
(async function init(){
  state.authReason = lockedReasonText();
  await authGate();
})();
</script>
</body>
