<style>
  :root{
    --ink:#16202E;
    --ink-2:#223047;
    --paper:#E9EDF2;
    --paper-2:#FFFFFF;
    --brass:#93733C;
    --brass-light:#C9A868;
    --forest:#3E6650;
    --forest-bg:#E1EBE4;
    --amber:#A96A22;
    --amber-bg:#F3E6D2;
    --rust:#9C3E2E;
    --rust-bg:#F2DFDA;
    --line:#CCD2DB;
    --text:#1C2333;
    --text-muted:#5B6472;
    --font-serif:'Source Serif 4', Georgia, serif;
    --font-sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-sans);
    background:var(--paper);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}
  ::selection{background:var(--brass-light);color:var(--ink);}

  /* ---------- Layout shells ---------- */
  .centered-shell{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:32px 20px;
  }
  .auth-card{
    width:100%;max-width:400px;background:var(--paper-2);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:36px 32px;position:relative;
  }
  .auth-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--brass),var(--brass-light));
  }
  .brandmark{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .brandmark svg{flex-shrink:0;color:var(--brass);}
  .brandmark span{font-family:var(--font-serif);font-size:19px;font-weight:600;color:var(--ink);letter-spacing:.2px;}
  .auth-card h1{font-family:var(--font-serif);font-size:22px;margin:0 0 6px;color:var(--ink);font-weight:600;}
  .auth-card p.sub{margin:0 0 24px;color:var(--text-muted);font-size:14px;line-height:1.5;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
  .field .hint{font-size:12px;color:var(--text-muted);margin-top:5px;line-height:1.4;}
  .input{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);
    font-size:14.5px;color:var(--text);background:#fff;transition:border-color .15s;
  }
  .input:focus{outline:none;border-color:var(--brass);}
  .input.error{border-color:var(--rust);}
  textarea.input{resize:vertical;min-height:64px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:10px 18px;border-radius:var(--radius);border:1px solid transparent;
    font-size:14px;font-weight:600;transition:opacity .15s,background .15s;
  }
  .btn-block{width:100%;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{opacity:.88;}
  .btn-brass{background:var(--brass);color:#fff;}
  .btn-brass:hover{opacity:.88;}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line);}
  .btn-ghost:hover{background:#00000006;}
  .btn-danger{background:transparent;color:var(--rust);border-color:var(--rust);}
  .btn-danger:hover{background:var(--rust-bg);}
  .btn-sm{padding:6px 12px;font-size:13px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-link{background:none;border:none;color:var(--brass);font-weight:600;font-size:13px;padding:4px 0;text-decoration:underline;}

  .error-text{color:var(--rust);font-size:13px;margin:2px 0 14px;line-height:1.4;}
  .divider{height:1px;background:var(--line);margin:22px 0;}

  /* ---------- Header ---------- */
  .app-header{
    background:var(--ink);color:#fff;padding:16px 28px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    position:sticky;top:0;z-index:20;border-bottom:3px solid var(--brass);
  }
  .app-header .brandmark span{color:#fff;}
  .app-header .brandmark svg{color:var(--brass-light);}
  .header-actions{display:flex;gap:8px;align-items:center;}
  .icon-btn{
    background:transparent;border:1px solid #ffffff30;color:#fff;
    width:36px;height:36px;border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{background:#ffffff14;}

  .container{max-width:1080px;margin:0 auto;padding:28px 24px 64px;width:100%;flex:1;}

  /* ---------- Banner ---------- */
  .banner{
    border:1px solid var(--amber);background:var(--amber-bg);color:#5c3d13;
    border-radius:var(--radius);padding:14px 16px;margin-bottom:24px;
    display:flex;gap:12px;align-items:flex-start;
  }
  .banner.rust{border-color:var(--rust);background:var(--rust-bg);color:#5c1f14;}
  .banner svg{flex-shrink:0;margin-top:2px;}
  .banner .banner-title{font-weight:700;font-size:14px;margin-bottom:4px;}
  .banner ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7;}

  /* ---------- Dashboard toolbar ---------- */
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .toolbar h1{font-family:var(--font-serif);font-size:26px;margin:0;color:var(--ink);font-weight:600;}
  .toolbar .sub{color:var(--text-muted);font-size:13.5px;margin-top:4px;}
  .search-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .search-row .input{max-width:320px;}
  .category-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .cat-pill{
    background:var(--paper-2);border:1px solid var(--line);color:var(--text-muted);
    padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;
  }
  .cat-pill .count{color:inherit;opacity:.65;margin-left:3px;}
  .cat-pill:hover{border-color:var(--brass);}
  .cat-pill.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .cat-pill.active .count{opacity:.75;}
  .category-tag{
    display:inline-block;background:var(--paper);color:var(--brass);
    font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;margin-bottom:6px;
  }

  /* ---------- Cards grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
  .cert-card{
    background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 16px;position:relative;border-left:4px solid var(--line);
    cursor:pointer;transition:box-shadow .15s,transform .15s;
  }
  .cert-card:hover{box-shadow:0 4px 14px #16202e14;transform:translateY(-1px);}
  .cert-card.status-valid{border-left-color:var(--forest);}
  .cert-card.status-soon{border-left-color:var(--amber);}
  .cert-card.status-expired{border-left-color:var(--rust);}
  .cert-card.status-none{border-left-color:var(--brass-light);}
  .cert-card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .cert-card h3{font-family:var(--font-serif);font-size:17px;margin:0 0 4px;color:var(--ink);font-weight:600;line-height:1.3;}
  .cert-card .cert-num{font-size:12.5px;color:var(--text-muted);margin-bottom:12px;}
  .cert-card .meta-row{font-size:12.5px;color:var(--text-muted);display:flex;justify-content:space-between;margin-top:2px;}
  .stamp{
    width:52px;height:52px;border-radius:50%;border:2px dashed;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    flex-shrink:0;text-align:center;line-height:1.05;
  }
  .stamp .num{font-size:15px;font-weight:700;font-family:var(--font-serif);}
  .stamp .lbl{font-size:8px;text-transform:uppercase;letter-spacing:.4px;}
  .stamp.status-valid{border-color:var(--forest);color:var(--forest);}
  .stamp.status-soon{border-color:var(--amber);color:var(--amber);}
  .stamp.status-expired{border-color:var(--rust);color:var(--rust);}
  .stamp.status-none{border-color:var(--brass);color:var(--brass);}

  .empty-state{
    text-align:center;padding:64px 20px;color:var(--text-muted);
    border:1px dashed var(--line);border-radius:var(--radius);background:#ffffff80;
  }
  .empty-state svg{color:var(--brass-light);margin-bottom:12px;}
  .empty-state h3{font-family:var(--font-serif);color:var(--ink);font-size:18px;margin:0 0 6px;}
  .empty-state p{margin:0 0 18px;font-size:14px;}

  /* ---------- Detail screen ---------- */
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:13.5px;font-weight:600;margin-bottom:16px;background:none;border:none;padding:0;}
  .back-link:hover{color:var(--ink);}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:6px;flex-wrap:wrap;}
  .detail-head h1{font-family:var(--font-serif);font-size:26px;margin:0;color:var(--ink);}
  .detail-head .cert-num{color:var(--text-muted);font-size:14px;margin-top:4px;}
  .status-pill{
    display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;
    font-size:12.5px;font-weight:700;white-space:nowrap;
  }
  .status-pill.status-valid{background:var(--forest-bg);color:var(--forest);}
  .status-pill.status-soon{background:var(--amber-bg);color:var(--amber);}
  .status-pill.status-expired{background:var(--rust-bg);color:var(--rust);}
  .status-pill.status-none{background:var(--paper);color:var(--brass);}

  .panel{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-top:20px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
  .panel-head h2{font-family:var(--font-serif);font-size:17px;margin:0;color:var(--ink);font-weight:600;}
  .panel-head .panel-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px;}

  .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:18px;}
  .avatar-preview{
    width:76px;height:76px;border-radius:50%;background:var(--paper);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;color:var(--brass);
  }
  .avatar-preview img{width:100%;height:100%;object-fit:cover;}
  .info-item .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);font-weight:600;margin-bottom:4px;}
  .info-item .value{font-size:15px;color:var(--text);font-family:var(--font-serif);}

  .file-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--paper);border-radius:var(--radius);border:1px solid var(--line);flex-wrap:wrap;}
  .file-row .file-info{display:flex;align-items:center;gap:10px;font-size:13.5px;}
  .file-row .file-info svg{color:var(--brass);flex-shrink:0;}
  .file-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .archive-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;flex-wrap:wrap;gap:10px;background:#fbfbfa;}
  .archive-item .meta{font-size:13px;color:var(--text-muted);}
  .archive-item .meta strong{color:var(--text);font-weight:600;}

  .center-item{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;background:#fbfbfa;}
  .center-item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .center-item h4{font-family:var(--font-serif);font-size:15px;margin:0 0 6px;color:var(--ink);}
  .center-detail-row{font-size:13px;color:var(--text-muted);display:flex;gap:6px;margin-top:3px;}
  .center-detail-row svg{flex-shrink:0;margin-top:1px;color:var(--brass);}
  .center-detail-row .empty-val{font-style:italic;opacity:.6;}
  .center-notes{margin-top:8px;font-size:13px;color:var(--text);background:#fff;border-radius:var(--radius);padding:8px 10px;border:1px solid var(--line);}

  .row-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-only{background:transparent;border:1px solid var(--line);width:30px;height:30px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--text-muted);}
  .icon-only:hover{background:var(--paper);color:var(--ink);}
  .icon-only.danger:hover{background:var(--rust-bg);color:var(--rust);border-color:var(--rust);}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:#16202ecc;display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:100;
  }
  .modal{
    background:#fff;border-radius:var(--radius);max-width:480px;width:100%;
    max-height:88vh;overflow-y:auto;padding:26px 26px 24px;position:relative;
  }
  .modal.modal-wide{max-width:620px;}
  .modal-title{font-family:var(--font-serif);font-size:19px;margin:0 0 4px;color:var(--ink);font-weight:600;}
  .modal-sub{font-size:13px;color:var(--text-muted);margin:0 0 20px;line-height:1.5;}
  .modal-close{position:absolute;top:18px;right:18px;background:none;border:none;color:var(--text-muted);}
  .modal-close:hover{color:var(--ink);}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
  .pin-dots{display:flex;gap:10px;justify-content:center;margin:18px 0 6px;}
  .pin-dots .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);}
  .pin-dots .dot.filled{background:var(--ink);border-color:var(--ink);}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .yn-toggle{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .yn-btn{background:#fff;border:none;padding:8px 24px;font-size:14px;font-weight:600;color:var(--text-muted);}
  .yn-btn:first-child{border-right:1px solid var(--line);}
  .yn-btn.active{background:var(--ink);color:#fff;}
  .yn-btn:not(.active):hover{background:var(--paper);}

  .btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .usage-bar{height:8px;background:var(--paper);border-radius:4px;overflow:hidden;margin:6px 0 4px;}
  .usage-bar span{display:block;height:100%;background:var(--brass);}
  .usage-bar.high span{background:var(--rust);}
  .check-list{margin-top:10px;}
  .check-row{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line);}
  .check-row .pass{color:var(--forest);font-weight:600;}
  .check-row .fail{color:var(--rust);font-weight:600;}
  .app-version{font-size:12px;color:var(--text-muted);text-align:center;margin:4px 0 0;}
  .env-notice{background:var(--amber-bg);color:#5c3d13;border-bottom:1px solid var(--amber);padding:10px 20px;font-size:13px;line-height:1.5;display:flex;gap:16px;align-items:flex-start;justify-content:space-between;}
  .env-notice .btn-link{color:#5c3d13;flex-shrink:0;}
  .date-field{display:flex;align-items:center;gap:6px;}
  .date-part{flex:1;min-width:0;text-align:center;padding:10px 4px;}
  .date-part.year{flex:1.8;}
  .date-sep{color:var(--text-muted);font-weight:600;}
  .date-field.error .date-part{border-color:var(--rust);}
  .backup-group{margin-top:20px;}
  .backup-group h3{font-family:var(--font-serif);font-size:15px;font-weight:600;margin:0 0 10px;color:var(--ink);}
  .backup-group .hint{font-size:12.5px;color:var(--text-muted);margin:10px 0 0;line-height:1.5;}
  .backup-last{font-size:13.5px;margin:14px 0 4px;color:var(--text);}
  .backup-msg{font-size:13.5px;line-height:1.5;padding:10px 12px;border-radius:var(--radius);margin:12px 0 0;}
  .backup-msg.ok{background:var(--forest-bg);color:var(--forest);}
  .backup-msg.error{background:var(--rust-bg);color:var(--rust);}
  .backup-busy{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--text-muted);margin:12px 0 0;}
  .spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .dbx-status{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:6px;}
  .dbx-status .dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--text-muted);display:inline-block;}
  .dbx-status .dot.on{background:var(--forest);border-color:var(--forest);}
  .setup-steps{margin:0 0 6px;padding-left:20px;font-size:13.5px;line-height:1.55;}
  .setup-steps li{margin-bottom:12px;}

const CATEGORIES = ['Travel Documents','STCW','Safety and Security','Medical','Other Yacht Documents'];
function categoryFor(cert){ return cert.category || 'Other Yacht Documents'; }
function certHasExpiration(cert){ return cert.hasExpiration !== false; } // undefined/true = has one (covers certs saved before this feature existed)

/* =========================================================
   UTIL
========================================================= */
function esc(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(){ return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,9); }

function formatDate(iso){
  if(!iso) return '—';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if(!m || +m[2] < 1 || +m[2] > 12) return iso;
  return `${+m[3]} ${MONTHS_SHORT[+m[2] - 1]} ${m[1]}`;   // e.g. 5 Oct 2026
}
function daysUntil(iso){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(iso + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}
// For sort ordering only: certificates with no expiration sort as "infinitely far
// away" so they naturally fall to the end of an "expiring soonest" list.
function sortableDays(cert){
  return certHasExpiration(cert) ? daysUntil(cert.expirationDate) : Infinity;
}
function statusFor(cert){
  if(!certHasExpiration(cert)) return 'none';
  const d = daysUntil(cert.expirationDate);
  if(d < 0) return 'expired';
  if(d <= (cert.notifyDays ?? 30)) return 'soon';
  return 'valid';
}
function statusLabel(s){
  if(s==='expired') return 'Expired';
  if(s==='soon') return 'Expiring soon';
  if(s==='none') return 'No expiration';
  return 'Valid';
}
function needsAttention(cert){
  const s = statusFor(cert);
  return s==='soon' || s==='expired';
}

function fileToDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}
function dataURLToBlob(dataUrl, forceMime){
  const [header, b64] = dataUrl.split(',');
  const mimeMatch = header.match(/:(.*?);/);
  const mime = forceMime || (mimeMatch ? mimeMatch[1] : 'application/pdf');
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: mime});
}
function downloadDataUrl(dataUrl, filename){
  const blob = dataURLToBlob(dataUrl, 'application/pdf');
  if(USE_SHARE_SHEET){
    offerFileToShare(blob, filename || 'certificate.pdf', {title: 'Open or save this certificate', note: `${filename || 'certificate.pdf'} is ready. Tap the button, then choose Save to Files, or open it in another app.`, button: 'Open / Save…'});
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename || 'certificate.pdf';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function downloadTextFile(text, filename, mime){
  const blob = new Blob([text], {type: mime || 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}


/* =========================================================
   STORAGE HELPERS — backed by IndexedDB (works fully offline,
   no Claude.ai account or connection required). Runs entirely in
   this browser, scoped to wherever this page is served from.
   IMPORTANT: IndexedDB requires the page be loaded over http://
   or https:// — Chrome blocks it for files opened directly from
   a folder (file://). Use the included start-mac.command or
   start-windows.bat launcher instead of double-clicking the HTML
   file directly.
========================================================= */
const DB_NAME = 'CertificateRegistryDB-test';
const STORE_NAME = 'kv';
let dbOpenPromise = null;
let dbConn = null;
let dbInfo = null;   // {name, version} of the database currently open, shown in the Storage panel

// Open the database at WHATEVER version it already has (version 1 is only created if it doesn't exist).
// Asking for a fixed version breaks as soon as the browser already holds a newer one:
// "VersionError: The requested version (1) is less than the existing version (2)."
function openDbAt(version){
  return new Promise((resolve, reject) => {
    let finished = false, blockedTimer = null;
    const req = (version === undefined) ? indexedDB.open(DB_NAME) : indexedDB.open(DB_NAME, version);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, {keyPath: 'key'});
    };
    req.onsuccess = () => {
      clearTimeout(blockedTimer);
      if(finished){ try{ req.result.close(); }catch(_){} return; }   // we had already given up on this attempt
      finished = true; resolve(req.result);
    };
    req.onerror = () => { clearTimeout(blockedTimer); if(!finished){ finished = true; reject(req.error || new Error('Failed to open the local database.')); } };
    req.onblocked = () => {
      // Another tab or window still has the database open. Give it a few seconds to let go.
      blockedTimer = setTimeout(() => { if(!finished){ finished = true; reject(new Error('The local database is in use by another open tab or window of this app. Close the other one and try again.')); } }, 4000);
    };
  });
}
function openDB(){
  if(dbOpenPromise) return dbOpenPromise;
  dbOpenPromise = (async () => {
    if(!window.indexedDB) throw new Error('IndexedDB is not available in this browser.');
    let db = await openDbAt();
    if(!db.objectStoreNames.contains(STORE_NAME)){
      // The database exists but has no store of ours yet: add it with a version bump. Anything else in there is left untouched.
      const next = db.version + 1;
      db.close();
      db = await openDbAt(next);
    }
    // If another tab upgrades the database, step aside and reopen on next use.
    db.onversionchange = () => { try{ db.close(); }catch(_){} if(dbConn === db){ dbConn = null; dbOpenPromise = null; } };
    db.onclose = () => { if(dbConn === db){ dbConn = null; dbOpenPromise = null; } };
    dbConn = db;
    dbInfo = {name: DB_NAME, version: db.version};
    return db;
  })();
  dbOpenPromise.catch(() => { dbOpenPromise = null; });   // one failed attempt must never poison later ones
  return dbOpenPromise;
}

let lastStorageError = null;   // the browser's own error from the most recent failed save
async function rawGetKey(key){
  try{
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.get(key);
      req.onsuccess = () => resolve(req.result ? req.result.value : null);
      req.onerror = () => reject(req.error);
    });
  }catch(e){
    console.error('getKey failed', key, e);
    return null;
  }
}
async function rawSetKey(key, value){
  try{
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      store.put({key, value});
      tx.oncomplete = () => { lastStorageError = null; resolve(true); };
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('Save was aborted.'));
    });
  }catch(e){
    lastStorageError = {name: (e && e.name) || '', message: (e && e.message) || '', key};
    console.error('setKey failed', key, e);
    return false;
  }
}
async function deleteKeySafe(key){
  try{
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      store.delete(key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => resolve(false);
    });
  }catch(e){
    return false; /* deleting a key that never existed is not a failure worth reporting */
  }
}
// Every normal read and write goes through these two: values are encrypted on the way in and
// decrypted on the way out. While the app is locked nothing can be read or written.
async function getKey(key){
  const v = await rawGetKey(key);
  if(isEncrypted(v)) return decryptValue(v);
  if(key === VAULT_KEY) return v;
  return dataKey ? v : null;
}
async function setKey(key, value){
  if(key === VAULT_KEY) return rawSetKey(key, value);
  if(!dataKey){ lastStorageError = {name: 'Locked', message: 'The app is locked.', key}; return false; }
  let sealed;
  try{ sealed = await encryptValue(value); }
  catch(e){ lastStorageError = {name: (e && e.name) || 'EncryptError', message: (e && e.message) || '', key}; return false; }
  return rawSetKey(key, sealed);
}
async function rawGetAll(){
  const db = await openDB();
  return await new Promise((resolve, reject) => {
    const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function rawPutMany(entries){
  const db = await openDB();
  return await new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite'), store = tx.objectStore(STORE_NAME);
    for(const e of entries) store.put({key: e.key, value: e.value});
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error || new Error('Save failed.'));
    tx.onabort = () => reject(tx.error || new Error('Save was aborted; nothing was changed.'));
  });
}
async function rawDeleteAll(){
  const db = await openDB();
  return await new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite'); tx.objectStore(STORE_NAME).clear();
    tx.oncomplete = () => resolve(true); tx.onerror = () => reject(tx.error); tx.onabort = () => reject(tx.error);
  });
}
// Replace ALL certificate data in one atomic transaction: either every old record is
// swapped for the new ones, or (if anything fails part-way) nothing changes at all.
// Keys starting with "__" are internal settings (e.g. the Dropbox connection) and are
// deliberately left alone.
async function replaceAllData(entries){
  if(!dataKey) throw new Error('The app is locked.');
  const sealed = [];
  for(const e of entries){
    if(e.key === VAULT_KEY || e.key === LOGIN_USER_KEY) continue;     // a backup file can never replace the login
    sealed.push({key: e.key, value: await encryptValue(e.value)});
  }
  entries = sealed;
  const db = await openDB();
  return await new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const keysReq = store.getAllKeys();
    keysReq.onsuccess = () => {
      for(const k of keysReq.result){
        if(typeof k === 'string' && !k.startsWith('__')) store.delete(k);
      }
      for(const e of entries) store.put({key: e.key, value: e.value});
    };
    keysReq.onerror = () => { try{ tx.abort(); }catch(_){} };
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error || new Error('Restore failed.'));
    tx.onabort = () => reject(tx.error || new Error('Restore was aborted; nothing was changed.'));
  });
}
async function getJSON(key, fallback){
  const raw = await getKey(key);
  if(raw === null || raw === undefined) return fallback;
  try{ return JSON.parse(raw); }catch(e){ return fallback; }
}
async function setJSON(key, obj){
  return setKey(key, JSON.stringify(obj));
}

async function loadCertificates(){ return getJSON('certificates', []); }
async function saveCertificates(list){ return setJSON('certificates', list); }
async function loadProfile(){ return getJSON('profile', {}); }
async function saveProfile(profile){ return setJSON('profile', profile); }
async function getCurrentPdf(certId){ return getJSON(`pdf:${certId}:current`, null); }
async function setCurrentPdf(certId, obj){ return setJSON(`pdf:${certId}:current`, obj); }
async function getArchivePdf(certId, archiveId){ return getJSON(`pdf:${certId}:archive:${archiveId}`, null); }
async function setArchivePdf(certId, archiveId, obj){ return setJSON(`pdf:${certId}:archive:${archiveId}`, obj); }
async function deleteAllPdfKeysForCert(cert){
  await deleteKeySafe(`pdf:${cert.id}:current`);
  for(const a of (cert.archive||[])){
    await deleteKeySafe(`pdf:${cert.id}:archive:${a.id}`);
  }
}

function render(){

  if(state.modal && state.modal === lastModalRef){ const mEl = document.querySelector('.modal'); if(mEl) modalScroll = mEl.scrollTop; }
  const app = document.getElementById('app');
  let html = '<div class="test-bar">Test version · separate from your live app · anything you add here stays here</div>';
  if(state.screen !== 'loading') html += renderEnvironmentNotice();
  if(state.screen === 'loading') html += renderLoading();
  else if(String(state.screen).startsWith('auth')) html += renderAuthScreen();
  else if(state.screen === 'dashboard') html += renderHeader() + renderDashboard();
  else if(state.screen === 'detail') html += renderHeader() + renderDetail();
  else if(state.screen === 'profile') html += renderHeader() + renderProfile();

}

function matchesFilters(c){
  const term = state.search.trim().toLowerCase();
  const matchesSearch = !term || c.name.toLowerCase().includes(term) || (c.certNumber||'').toLowerCase().includes(term);
  const matchesCategory = state.categoryFilter === 'all' || categoryFor(c) === state.categoryFilter;
  return matchesSearch && matchesCategory;
}
function sortCerts(list){
  const sorted = list.slice();
  if(state.sortBy === 'name'){
    sorted.sort((a,b)=> a.name.localeCompare(b.name));
  } else if(state.sortBy === 'category'){
    sorted.sort((a,b)=> categoryFor(a).localeCompare(categoryFor(b)) || a.name.localeCompare(b.name));
  } else if(state.sortBy === 'recent'){
    sorted.sort((a,b)=> new Date(b.createdAt||0) - new Date(a.createdAt||0));
  } else {
    sorted.sort((a,b)=> sortableDays(a) - sortableDays(b));
  }
  return sorted;
}
function filteredSortedCerts(){
  return sortCerts(state.certificates.filter(matchesFilters));
}

function renderDashboard(){
  const list = filteredSortedCerts();

  const attention = state.certificates
    .filter(needsAttention)
    .sort((a,b)=> sortableDays(a) - sortableDays(b));

  let banner = '';
  if(attention.length){
    const anyExpired = attention.some(c=>statusFor(c)==='expired');
    banner = `
    <div class="banner ${anyExpired ? 'rust' : ''}">
      ${ICONS.alert}
      <div>
        <div class="banner-title">${attention.length} certificate${attention.length>1?'s':''} need${attention.length>1?'':'s'} attention</div>
        <ul>
          ${attention.map(c=>{
            const d = daysUntil(c.expirationDate);
            const s = statusFor(c);
            const txt = s==='expired' ? `expired ${Math.abs(d)} day${Math.abs(d)===1?'':'s'} ago` : `expires in ${d} day${d===1?'':'s'}`;
            return `<li><strong>${esc(c.name)}</strong> — ${txt}. Booking details for its training centers are in the certificate record.</li>`;
          }).join('')}
        </ul>
      </div>
    </div>`;
  }

  let body;
  if(!state.certificates.length){
    body = `
    <div class="empty-state">
      ${ICONS.seal}
      <h3>No certificates yet</h3>
      <p>Add your first certificate to start tracking its expiration and renewal.</p>
      <button class="btn btn-brass" onclick="openAddCertModal()">${ICONS.plus} Add certificate</button>
    </div>`;
  } else {
    body = `<div class="grid">${list.map(renderCertCard).join('')}</div>`;
    if(!list.length){
      body = `<div class="empty-state"><h3>No matches</h3><p>Try a different search or category.</p></div>`;
    }
  }

  return `
  <div class="container">
    ${banner}
    <div class="toolbar">
      <div>
        <h1>Your certificates</h1>
        <div class="sub">${state.certificates.length} on record</div>
      </div>
      <button class="btn btn-brass" onclick="openAddCertModal()">${ICONS.plus} Add certificate</button>
    </div>
    <div class="search-row">
      <input class="input" placeholder="Search by name or certificate number" value="${esc(state.search)}" oninput="state.search=this.value; renderDashboardListOnly();">
      <select class="input" style="max-width:200px;" onchange="state.sortBy=this.value; renderDashboardListOnly();">
        <option value="expiry" ${state.sortBy==='expiry'?'selected':''}>Sort: Expiring soonest</option>
        <option value="name" ${state.sortBy==='name'?'selected':''}>Sort: Name (A–Z)</option>
        <option value="category" ${state.sortBy==='category'?'selected':''}>Sort: Category</option>
        <option value="recent" ${state.sortBy==='recent'?'selected':''}>Sort: Recently added</option>
      </select>
    </div>
    <div class="category-filters">${renderCategoryPills()}</div>
    <div id="dashList">${body}</div>
  </div>`;
}

function renderCategoryPills(){
  const all = state.certificates;
  const pill = (value, label, count) => `<button class="cat-pill ${state.categoryFilter===value?'active':''}" onclick="setCategoryFilter('${esc(value)}')">${esc(label)} <span class="count">${count}</span></button>`;
  let html = pill('all', 'All', all.length);
  html += CATEGORIES.map(cat => pill(cat, cat, all.filter(c=>categoryFor(c)===cat).length)).join('');
  return html;
}
function setCategoryFilter(value){
  state.categoryFilter = value;
  renderDashboardListOnly();
  const pillsEl = document.querySelector('.category-filters');
  if(pillsEl) pillsEl.innerHTML = renderCategoryPills();
}

function renderDashboardListOnly(){
  // Lightweight re-render of just the list on search/filter change, to preserve input focus.
  const el = document.getElementById('dashList');
  if(!el) return;
  const list = filteredSortedCerts();
  if(!state.certificates.length){
    return; // full render() already handles the true empty state
  }
  if(!list.length){
    el.innerHTML = `<div class="empty-state"><h3>No matches</h3><p>Try a different search or category.</p></div>`;
  } else {
    el.innerHTML = `<div class="grid">${list.map(renderCertCard).join('')}</div>`;
  }
}

function renderCertCard(c){
  const s = statusFor(c);
  let stampInner;
  if(s === 'none'){
    stampInner = `<span class="num" style="font-size:11px;line-height:1.15;">No<br>expiry</span>`;
  } else {
    const d = daysUntil(c.expirationDate);
    const numLabel = s==='expired' ? Math.abs(d) : d;
    const sub = s==='expired' ? 'days over' : 'days left';
    stampInner = `<span class="num">${numLabel}</span><span class="lbl">${sub}</span>`;
  }
  return `
  <div class="cert-card status-${s}" onclick="openDetail('${c.id}')">
    <div class="cert-card-top">
      <div>
        <div class="category-tag">${esc(categoryFor(c))}</div>
        <h3>${esc(c.name)}</h3>
        <div class="cert-num">${c.certNumber ? '#'+esc(c.certNumber) : 'No number on file'}</div>
      </div>
      <div class="stamp status-${s}">${stampInner}</div>
    </div>
    <div class="meta-row"><span>Expires</span><span>${certHasExpiration(c) ? formatDate(c.expirationDate) : 'No expiration'}</span></div>
    <div class="meta-row"><span>Status</span><span>${statusLabel(s)}</span></div>
  </div>`;
}

/* =========================================================
   EVENT WIRING (focus management + keyboard support for modals)
========================================================= */
function markDirty(){ modalDirty = true; }

function getFocusableInModal(){
  const modalEl = document.querySelector('.modal');
  if(!modalEl) return [];
  return Array.from(modalEl.querySelectorAll('input, select, textarea, button, a[href]'))
    .filter(el => !el.disabled && el.offsetParent !== null);
}

function afterRender(){
  if(state.modal && state.modal !== lastModalRef){
    // Modal just opened (or was swapped for a different one) — focus its first field.
    const focusables = getFocusableInModal();
    if(focusables.length) focusables[0].focus();
    if(state.modal.type === 'dropboxSetup'){
      const keyEl = document.getElementById('dbx_appkey');
      if(keyEl) keyEl.focus();
    }
  }
  lastModalRef = state.modal;
}

function handleGlobalKeydown(e){
  if(!state.modal) return;
  if(e.key === 'Escape'){
    e.preventDefault();
    closeModal();
    return;
  }
  if(e.key === 'Tab'){
    const focusables = getFocusableInModal();
    if(!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    if(e.shiftKey && document.activeElement === first){
      e.preventDefault(); last.focus();
    } else if(!e.shiftKey && document.activeElement === last){
      e.preventDefault(); first.focus();
    }
    return;
  }
  if(e.key === 'Enter'){
    const tag = (e.target.tagName || '').toLowerCase();
    if(tag === 'textarea' || tag === 'button' || tag === 'a') return; // let newlines / native activation happen
    if(!e.target.closest || !e.target.closest('.modal')) return;
    const t = state.modal.type;
    if(t === 'changeLogin' || t === 'changeRecovery'){ e.preventDefault(); if(t === 'changeLogin') submitChangeLogin(); else submitChangeRecovery(); return; }
    if(t === 'certForm' || t === 'trainingCenterForm' || t === 'fileUpload' || t === 'dropboxSetup'){
      e.preventDefault();
      if(t === 'certForm') submitCertForm();
      else if(t === 'trainingCenterForm') submitTrainingCenter();
      else if(t === 'fileUpload') submitFileUpload();
      else if(t === 'dropboxSetup') submitDropboxSetup();
    }
    // Deliberately NOT wired for 'confirm' modals — an accidental Enter shouldn't
    // trigger a destructive action like deleting a certificate.
  }
}
document.addEventListener('keydown', handleGlobalKeydown);

function closeModal(){
  const m = state.modal;
  if(!m) return;
  captureModalDraft();   // so "Keep editing" on the discard prompt brings back exactly what was typed

  // A "discard-changes?" confirm (or similar) can define its own Cancel behavior
  // instead of a blanket close — e.g. returning to the form it interrupted.
  if(m.type === 'confirm' && m.onCancel){
    m.onCancel();
    return;
  }

  const formTypes = ['certForm', 'trainingCenterForm', 'fileUpload'];
  if(modalDirty && formTypes.includes(m.type)){
    const formModal = m;
    state.modal = {
      type: 'confirm', title: 'Discard changes?', danger: true, confirmLabel: 'Discard',
      message: "You've entered information that hasn't been saved yet. If you leave now, it will be lost.",
      onConfirm: () => { modalDirty = false; state.modal = null; render(); },
      onCancel: () => { state.modal = formModal; render(); }
    };
    render();
    return;
  }

  if(m.type === 'pdfPreview' && m.url){
    URL.revokeObjectURL(m.url);
  }
  modalDirty = false;
  state.modal = null;
  render();
}

async function handleProfilePhotoChange(input){
  const file = input.files && input.files[0];
  input.value = ''; // lets the same photo be chosen again
  if(!file) return;
  if(!file.type.startsWith('image/')){
    state.photoError = 'Please choose an image file.';
    renderKeepingDraft();
    return;
  }
  if(file.size > PHOTO_UPLOAD_LIMIT){
    state.photoError = `That photo is very large (${formatBytes(file.size)}). Please choose one under about 25 MB.`;
    renderKeepingDraft();
    return;
  }
  let dataUrl;
  try{ dataUrl = await smallPhotoFrom(file); }
  catch(e){
    console.error('Photo could not be read', e);
    state.photoError = "The browser couldn't read that image. Please choose a JPG or PNG photo.";
    renderKeepingDraft();
    return;
  }
  try{
    const candidate = {...(state.profile||{}), photo: dataUrl};
    const ok = await saveProfile(candidate);
    if(!ok){ throw new Error('save failed'); }
    state.profile = candidate;
    state.photoError = '';
    state.profileSaved = true;
    renderKeepingDraft();
  }catch(err){
    console.error('Profile photo save failed', err);
    state.photoError = "That photo couldn't be saved. " + await saveFailureReason();
    renderKeepingDraft();
  }
}
async function removeProfilePhoto(){
  const candidate = {...state.profile};
  delete candidate.photo;
  const ok = await saveProfile(candidate);
  if(!ok){
    showErrorModal("Couldn't save", "This didn't save. " + await saveFailureReason());
    return;
  }
  state.profile = candidate;
  renderKeepingDraft();
}
async function submitProfile(){
  const typed = {
    name: document.getElementById('pf_name').value.trim(),
    surname: document.getElementById('pf_surname').value.trim(),
    contact: document.getElementById('pf_contact').value.trim(),
    email: document.getElementById('pf_email').value.trim(),

  };
  state.profileError = '';
  let profile = {...state.profile, ...typed};
  profile = await ensureSmallPhoto(profile);   // an oversized stored photo is shrunk first, so this save stays small
  const ok = await saveProfile(profile);
  if(ok){
    state.profile = profile;
    state.profileDraft = null;
    state.profileSaved = true;
    state.profileError = '';
    suppressDraftCapture = true;
    try{ render(); } finally { suppressDraftCapture = false; }
  } else {
    // Keep what was typed so it can be retried, and don't pretend it was saved.
    state.profileDraft = typed;
    state.profileSaved = false;
    state.profileError = "Your details weren't saved. " + await saveFailureReason();
    render();
  }
}

async function submitCertForm(){
  const modal = state.modal;
  const category = document.getElementById('cf_category').value;
  const name = document.getElementById('cf_name').value.trim();
  const certNumber = document.getElementById('cf_number').value.trim();
  const hasExpiration = modal.cert.hasExpiration !== false;
  const issue = composeDate(readDateParts('cf_issue'));
  const expiry = hasExpiration ? composeDate(readDateParts('cf_expiry')) : {status: 'empty', iso: ''};
  const notifyEl = document.getElementById('cf_notify');
  const notifyDays = hasExpiration ? (parseInt(notifyEl && notifyEl.value, 10) || 30) : null;

  // Show the problem, keep everything that was typed, and put the cursor where it needs fixing.
  const fail = (message, field) => { modal.error = message; modal.errorField = field; render(); focusFormField(field); };
  if(!name) return fail('Certificate name is required.', 'cf_name');
  if(issue.status === 'incomplete' || issue.status === 'invalid') return fail("The issue date isn't a valid date. Enter it as day, month and year, or leave it empty.", 'cf_issue');
  if(hasExpiration){
    if(expiry.status === 'empty') return fail('Expiration date is required, or choose "No" above if this document never expires.', 'cf_expiry');
    if(expiry.status !== 'ok') return fail("The expiration date isn't a valid date. Enter it as day, month and year.", 'cf_expiry');
    if(issue.status === 'ok' && expiry.iso < issue.iso) return fail('The expiration date is before the issue date. Please check both dates.', 'cf_expiry');
  }
  const issueDate = issue.iso;
  const expirationDate = hasExpiration ? expiry.iso : '';

  const editingId = modal.editingId;
  // Build the candidate list first and only replace state.certificates once the
  // save is confirmed, so a failed save never pretends to have worked.
  const candidate = state.certificates.slice();
  if(editingId){
    const idx = candidate.findIndex(c=>c.id===editingId);
    candidate[idx] = {
      ...candidate[idx],
      category, name, certNumber, issueDate, hasExpiration, expirationDate, notifyDays,
      updatedAt: new Date().toISOString()
    };
  } else {
    candidate.push({
      id: uid(), category, name, certNumber, issueDate, hasExpiration, expirationDate, notifyDays,
      currentFile: null, archive: [], trainingCenters: [],
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
    });
  }

  modal.error = ''; modal.errorField = '';
  const ok = await saveCertificates(candidate);
  if(!ok){
    modal.error = "This didn't save. " + await saveFailureReason() + " Your entries are still in this form; try again.";
    if(state.modal === modal) render();
    return;
  }
  state.certificates = candidate;
  modalDirty = false;
  state.modal = null;
  if(editingId){ state.screen='detail'; }
  render();
}

function confirmDeleteCert(id){
  const c = state.certificates.find(x=>x.id===id);

  state.modal = {

    message:`This permanently deletes "${c.name}", its uploaded file, archived history, and training center details.`,
    onConfirm: async () => {

  render();
}

/* =========================================================
   FILE UPLOAD / ARCHIVE
========================================================= */
function openReplaceFileModal(certId){
  const c = state.certificates.find(x=>x.id===certId);
  modalDirty = false;
  state.modal = {type:'fileUpload', certId, hasExisting: !!(c && c.currentFile), error:'', busy:false};

async function submitFileUpload(){
  const input = document.getElementById('fileInput');
  const file = input.files && input.files[0];
  if(!file){ state.modal.error = 'Choose a PDF file first.'; render(); return; }
  if(file.type !== 'application/pdf'){ state.modal.error = 'Only PDF files are supported.'; render(); return; }
  if(file.size > 15 * 1024 * 1024){ state.modal.error = 'File is too large. Please keep it under about 15 MB.'; render(); return; }

  const modal = state.modal;
  modal.busy = true; modal.error = ''; render();

  const certId = modal.certId;
  const c = state.certificates.find(x => x.id === certId);
  let archiveId = null, wroteCurrent = false, previousCurrent = null;
  try{
    const dataUrl = await fileToDataURL(file);
    const fileRecord = {filename: file.name, data: dataUrl, uploadedDate: new Date().toISOString().slice(0,10)};

    // 1. Archive the existing file first, and confirm that copy really saved.
    let archiveEntry = null;
    if(c.currentFile){
      previousCurrent = await getCurrentPdf(certId);
      if(previousCurrent){
        const newArchiveId = uid();
        const archived = await setArchivePdf(certId, newArchiveId, previousCurrent);
        if(!archived) throw new Error('Could not archive the previous file.');
        archiveId = newArchiveId;
        archiveEntry = {
          id: newArchiveId,
          filename: c.currentFile.filename,
          archivedDate: new Date().toISOString().slice(0,10),
          expirationDate: c.expirationDate
        };
      }
    }

    // 2. Save the new file.
    const saved = await setCurrentPdf(certId, fileRecord);
    if(!saved) throw new Error('Could not save the new file.');
    wroteCurrent = true;

    // 3. Save the certificate record. The update is built on a COPY, and what's on screen only
    //    changes once storage has confirmed it, so the screen can never get ahead of what's saved.
    const updated = {
      ...c,
      archive: archiveEntry ? [...(c.archive || []), archiveEntry] : (c.archive || []),
      currentFile: {filename: file.name, uploadedDate: fileRecord.uploadedDate},
      updatedAt: new Date().toISOString()
    };
    const candidate = state.certificates.map(x => x.id === certId ? updated : x);
    const metaSaved = await saveCertificates(candidate);
    if(!metaSaved) throw new Error('Could not save the certificate record.');
    state.certificates = candidate;
    modalDirty = false;
    state.modal = null;
    render();
  }catch(err){
    console.error('File upload failed', err);
    // Put storage back exactly as it was, so the stored files still match the certificate record.
    try{
      if(wroteCurrent){
        const restored = previousCurrent ? await setCurrentPdf(certId, previousCurrent) : await deleteKeySafe(`pdf:${certId}:current`);
        if(restored && archiveId) await deleteKeySafe(`pdf:${certId}:archive:${archiveId}`);
      } else if(archiveId){
        await deleteKeySafe(`pdf:${certId}:archive:${archiveId}`);
      }
    }catch(undoErr){ console.error('Could not undo a partial upload', undoErr); }
    const message = 'The file could not be saved, so your certificate was left as it was. ' + await saveFailureReason();
    if(state.modal === modal){ modal.busy = false; modal.error = message; render(); }
    else { showErrorModal("Couldn't save the file", message); }
  }
}

  state.modal = {type:'confirm', title, confirmLabel:'OK', message, onConfirm: ()=>{ state.modal=null; render(); }};

function openTrainingCenterModal(certId, centerId){
  const c = state.certificates.find(x=>x.id===certId);
  const center = centerId ? c.trainingCenters.find(t=>t.id===centerId) : null;
  modalDirty = false;

async function submitTrainingCenter(){
  const name = document.getElementById('tc_name').value.trim();
  if(!name){ state.modal.error = 'Center name is required.'; render(); return; }
  const data = {
    name,
    contact: document.getElementById('tc_contact').value.trim(),
    phone: document.getElementById('tc_phone').value.trim(),
    email: document.getElementById('tc_email').value.trim(),
    address: document.getElementById('tc_address').value.trim(),
    notes: document.getElementById('tc_notes').value.trim(),
  };
  const certId = state.modal.certId;
  const editingId = state.modal.editingId;

  // Work on a deep-enough copy so a failed save doesn't leave state.certificates
  // holding changes that were never actually persisted.
  const candidate = state.certificates.map(c => c.id === certId ? {...c, trainingCenters: (c.trainingCenters||[]).slice()} : c);
  const c = candidate.find(x=>x.id===certId);
  if(editingId){
    const idx = c.trainingCenters.findIndex(t=>t.id===editingId);
    c.trainingCenters[idx] = {...c.trainingCenters[idx], ...data};
  } else {
    c.trainingCenters.push({id: uid(), ...data});
  }

  state.modal.error = '';
  const ok = await saveCertificates(candidate);
  if(!ok){
    state.modal.error = "This didn't save. " + await saveFailureReason();
    render();
    return;
  }
  state.certificates = candidate;
  modalDirty = false;
  state.modal = null;
  render();
}

  const ok = await saveCertificates(candidate);

/* =========================================================
   BACKUP & RESTORE
   A backup is ONE .json file holding the profile, every certificate's
   details and every uploaded PDF (current + archived). It can be saved to
   Dropbox or downloaded, and loaded back from Dropbox or from this Mac.
========================================================= */
const BACKUP_FORMAT = 'certificate-registry-backup';
const BACKUP_VERSION = 2;
const SAFE_ID = /^[A-Za-z0-9_-]{1,80}$/;
const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;
const PDF_DATA_PREFIX = 'data:application/pdf;base64,';
const B64_BODY = /^[A-Za-z0-9+/]*={0,2}$/;
const IMAGE_DATA_URL = /^data:image\/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+/]*={0,2}$/;

function formatBytes(n){
  if(!(n >= 0)) return '';
  if(n < 1024) return n + ' B';
  if(n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
  return (n / (1024 * 1024)).toFixed(1) + ' MB';
}
function formatDateTime(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  const p = n => String(n).padStart(2, '0');
  return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]} ${d.getFullYear()}, ${p(d.getHours())}:${p(d.getMinutes())}`;   // 19 Oct 2026, 14:32
}
function plural(n, one, many){ return n + ' ' + (n === 1 ? one : (many || one + 's')); }
function backupFileName(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `Certificate-Registry-Backup_${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`;
}
function hasProfileData(p){
  return !!p && ['name', 'surname', 'contact', 'email', 'gender', 'photo'].some(k => p[k]);
}
function isRegistryEmpty(){
  return state.certificates.length === 0 && !hasProfileData(state.profile);
}

async function buildBackupPayload(){
  const certificates = state.certificates;
  const files = {};
  let included = 0, missing = 0;
  for(const c of certificates){
    if(c.currentFile){
      const rec = await getCurrentPdf(c.id);
      if(rec && typeof rec.data === 'string'){ files[`pdf:${c.id}:current`] = rec; included++; } else { missing++; }
    }
    for(const a of (c.archive || [])){
      const rec = await getArchivePdf(c.id, a.id);
      if(rec && typeof rec.data === 'string'){ files[`pdf:${c.id}:archive:${a.id}`] = rec; included++; } else { missing++; }
    }
  }
  const payload = {
    format: BACKUP_FORMAT,
    version: BACKUP_VERSION,
    app: 'Certificate Registry',
    exportedAt: new Date().toISOString(),
    counts: {certificates: certificates.length, pdfFiles: included},
    profile: state.profile || {},
    certificates,
    files,
  };
  return {payload, included, missing};
}

/* ---------- Validation: a backup is untrusted input, so rebuild every record
   from known fields only. (Text limits below are deliberately huge: they exist only to
   stop absurd input, and must never trim anything a person could really have typed.) IDs end up inside inline onclick handlers, so they
   must be plain [A-Za-z0-9_-]; PDFs must really be PDF data URLs. ---------- */
function cleanStr(v, max){ return typeof v === 'string' ? v.slice(0, max) : ''; }
function cleanDate(v){ return (typeof v === 'string' && ISO_DATE.test(v)) ? v : ''; }
function cleanIso(v){ return (typeof v === 'string' && v.length <= 40) ? v : ''; }
function isPlainObject(v){ return !!v && typeof v === 'object' && !Array.isArray(v); }
function cleanPdfRecord(rec){
  if(!isPlainObject(rec)) return null;
  if(typeof rec.data !== 'string' || !rec.data.startsWith(PDF_DATA_PREFIX)) return null;
  if(!B64_BODY.test(rec.data.slice(PDF_DATA_PREFIX.length))) return null;
  return {filename: cleanStr(rec.filename, 255) || 'certificate.pdf', data: rec.data, uploadedDate: cleanDate(rec.uploadedDate)};
}
function sanitizeCert(c){
  if(!isPlainObject(c) || typeof c.id !== 'string' || !SAFE_ID.test(c.id)) return null;
  const expirationDate = cleanDate(c.expirationDate);
  let hasExp = c.hasExpiration !== false;
  if(hasExp && !expirationDate) hasExp = false; // an expiring document needs a valid date to be trackable
  const n = Number(c.notifyDays);
  return {
    id: c.id,
    category: CATEGORIES.includes(c.category) ? c.category : 'Other Yacht Documents',
    name: cleanStr(c.name, 1000).trim() || 'Untitled certificate',
    certNumber: cleanStr(c.certNumber, 1000),
    issueDate: cleanDate(c.issueDate),
    hasExpiration: hasExp,
    expirationDate: hasExp ? expirationDate : '',
    notifyDays: hasExp ? (Number.isFinite(n) ? Math.min(365, Math.max(1, Math.round(n))) : 30) : null,
    currentFile: null,
    archive: [],
    trainingCenters: [],
    createdAt: cleanIso(c.createdAt),
    updatedAt: cleanIso(c.updatedAt),
  };
}
function sanitizeProfile(rp){
  const p = isPlainObject(rp) ? rp : {};
  const out = {
    name: cleanStr(p.name, 1000),
    surname: cleanStr(p.surname, 1000),
    contact: cleanStr(p.contact, 500),
    email: cleanStr(p.email, 1000),
    gender: ['Female', 'Male', 'Other'].includes(p.gender) ? p.gender : '',
  };
  if(typeof p.photo === 'string' && p.photo.length < 9 * 1024 * 1024 && IMAGE_DATA_URL.test(p.photo)) out.photo = p.photo;
  return out;
}
function validateBackup(obj){
  const notBackup = {ok: false, error: "That file isn't a Certificate Registry backup."};
  if(!isPlainObject(obj)) return notBackup;
  if(obj.format !== undefined && obj.format !== BACKUP_FORMAT) return notBackup;
  if(!Array.isArray(obj.certificates)) return {ok: false, error: "That file doesn't contain any certificate data, so it can't be a Certificate Registry backup."};
  if(typeof obj.version === 'number' && obj.version > BACKUP_VERSION) return {ok: false, error: 'That backup was made by a newer version of this app. Update the app to the latest version first, then try again.'};
  if(obj.certificates.length > 2000) return {ok: false, error: 'That file has far too many certificates to be a genuine backup.'};

  const files = isPlainObject(obj.files) ? obj.files : {};
  const seen = new Set();
  const certificates = [];
  const pdfRecords = {};
  let missingPdfs = 0, skipped = 0;

  for(const raw of obj.certificates){
    const cert = sanitizeCert(raw);
    if(!cert || seen.has(cert.id)){ skipped++; continue; }
    seen.add(cert.id);

    if(isPlainObject(raw.currentFile)){
      const key = `pdf:${cert.id}:current`;
      const rec = cleanPdfRecord(files[key]);
      if(rec){
        pdfRecords[key] = rec;
        cert.currentFile = {filename: rec.filename, uploadedDate: rec.uploadedDate};
      } else { missingPdfs++; }
    }
    if(Array.isArray(raw.archive)){
      for(const a of raw.archive){
        if(!isPlainObject(a) || typeof a.id !== 'string' || !SAFE_ID.test(a.id)) continue;
        const key = `pdf:${cert.id}:archive:${a.id}`;
        const rec = cleanPdfRecord(files[key]);
        if(!rec){ missingPdfs++; continue; }
        pdfRecords[key] = rec;
        cert.archive.push({id: a.id, filename: cleanStr(a.filename, 255) || rec.filename, archivedDate: cleanDate(a.archivedDate), expirationDate: cleanDate(a.expirationDate)});
      }
    }
    if(Array.isArray(raw.trainingCenters)){
      for(const t of raw.trainingCenters){
        if(!isPlainObject(t) || typeof t.id !== 'string' || !SAFE_ID.test(t.id)) continue;
        cert.trainingCenters.push({
          id: t.id,
          name: cleanStr(t.name, 1000) || 'Training center',
          contact: cleanStr(t.contact, 1000),
          phone: cleanStr(t.phone, 500),
          email: cleanStr(t.email, 1000),
          address: cleanStr(t.address, 5000),
          notes: cleanStr(t.notes, 100000),
        });
      }
    }
    certificates.push(cert);
  }

  const profile = sanitizeProfile(obj.profile);
  return {
    ok: true,
    data: {certificates, profile, pdfRecords},
    info: {
      exportedAt: cleanIso(obj.exportedAt),
      certCount: certificates.length,
      pdfCount: Object.keys(pdfRecords).length,
      missingPdfs, skipped,
      hasProfile: hasProfileData(profile),
      legacy: obj.format === undefined,
    },
  };
}
function parseBackupText(text){
  let obj;
  try{ obj = JSON.parse(text); }
  catch(e){ return {ok: false, error: "That file couldn't be read — it isn't a valid backup file."}; }
  return validateBackup(obj);
}
function buildRestoreEntries(data){
  const entries = [
    {key: 'certificates', value: JSON.stringify(data.certificates)},
    {key: 'profile', value: JSON.stringify(data.profile)},
  ];
  for(const [key, rec] of Object.entries(data.pdfRecords)) entries.push({key, value: JSON.stringify(rec)});
  return entries;
}

/* ---------- Save: download to this Mac ---------- */
async function exportBackup(){
  if(state.backupBusy) return;
  if(isRegistryEmpty()){ setBackupMessage('error', 'There is nothing to back up yet — add a certificate or fill in your profile first.'); return; }
  state.backupMessage = null;
  setBackupBusy('Preparing backup…');
  try{
    const {payload, included, missing} = await buildBackupPayload();
    const filename = backupFileName();
    const text = JSON.stringify(payload);
    const skipped = missing ? ` ${plural(missing, 'PDF file')} could not be read and ${missing === 1 ? 'is' : 'are'} not included.` : '';
    if(USE_SHARE_SHEET){
      state.backupBusy = '';
      offerFileToShare(new Blob([text], {type: 'application/json'}), filename, {
        title: 'Your backup is ready',
        note: `${filename}: ${plural(payload.counts.certificates, 'certificate')} and ${plural(included, 'PDF file')} (${(text.length / 1048576).toFixed(1)} MB). Tap Save to Files, then choose a place such as iCloud Drive or On My ${DEVICE_NAME}.${skipped}`,
        onDone: async () => {
          await recordBackup('saved to Files', filename, payload.counts);
          setBackupMessage('ok', `Backup saved as ${filename} with ${plural(payload.counts.certificates, 'certificate')} and ${plural(included, 'PDF file')}.${skipped}`);
        }
      });
      return;
    }
    downloadTextFile(text, filename, 'application/json');
    await recordBackup('downloaded to this Mac', filename, payload.counts);
    setBackupMessage('ok',
      `Backup downloaded as ${filename} with ${plural(payload.counts.certificates, 'certificate')} and ${plural(included, 'PDF file')}. ` +
      `Chrome saved it to your usual downloads location — drag it into your Dropbox folder if you want a copy there.` + skipped);
  }catch(err){
    console.error('Backup failed', err);
    setBackupMessage('error', "The backup couldn't be created. Please try again.");
  }
}

/* ---------- Restore (shared by "from this Mac" and "from Dropbox") ---------- */
function prepareRestore(text, sourceLabel){
  const result = parseBackupText(text);
  if(!result.ok){ showErrorModal("Can't load this backup", result.error); return; }
  const info = result.info;
  const when = info.exportedAt ? formatDateTime(info.exportedAt) : 'an unknown date';
  let msg = `From ${sourceLabel}: a backup saved ${when} with ${plural(info.certCount, 'certificate')}, ${plural(info.pdfCount, 'PDF file')}${info.hasProfile ? ' and a profile' : ''}. ` +
            `Loading it replaces everything currently in the app (${plural(state.certificates.length, 'certificate')}). `;
  if(info.legacy) msg += 'This is an older-style backup that has no PDF files in it, so certificates will come back without their PDFs. ';
  else if(info.missingPdfs) msg += `${plural(info.missingPdfs, 'PDF file')} listed in this backup are missing from it and will not be restored. `;
  if(info.skipped) msg += `${info.skipped} damaged certificate entr${info.skipped === 1 ? 'y' : 'ies'} will be skipped. `;
  msg += "This can't be undone — if you're not sure, cancel and save a backup of your current data first.";
  state.modal = {
    type: 'confirm', title: 'Replace your data with this backup?', danger: true, confirmLabel: 'Replace my data',
    message: msg,
    onConfirm: () => applyRestore(result.data, sourceLabel, info),
  };
  render();
}
async function applyRestore(data, sourceLabel, info){
  state.modal = null;
  state.backupMessage = null;
  state.backupBusy = 'Restoring your data…';
  renderKeepingDraft();
  let restored = false;
  try{
    await replaceAllData(buildRestoreEntries(data));
    state.certificates = data.certificates;
    state.profile = data.profile;
    state.profileDraft = null;
    state.activeCertId = null;
    previousScreen = 'dashboard';
    state.search = '';
    state.categoryFilter = 'all';
    restored = true;
    state.backupBusy = '';
    state.backupMessage = {type: 'ok', text: `Restored ${plural(info.certCount, 'certificate')} and ${plural(info.pdfCount, 'PDF file')} from ${sourceLabel}.`};
  }catch(err){
    console.error('Restore failed', err);
    state.backupBusy = '';
    state.backupMessage = {type: 'error', text: "The restore didn't complete, and your existing data was left exactly as it was. Please try again."};
  }
  suppressDraftCapture = restored;   // after a successful restore the form must show the RESTORED profile
  try{ render(); } finally { suppressDraftCapture = false; }
}


/* =========================================================
   DROPBOX — direct connection through Dropbox's own web API.
   Why not just write into the Dropbox folder on the Mac? Chrome refuses web
   pages access to anything under ~/Library, which is exactly where current
   Dropbox versions keep their folder (~/Library/CloudStorage/Dropbox).
   Uses OAuth with PKCE, so no secret is ever stored; the app only receives
   access to its own folder in Dropbox (when the Dropbox app is created as
   an "App folder" app, as the setup steps instruct).
========================================================= */
const DBX_AUTH_URL = 'https://www.dropbox.com/oauth2/authorize';
const DBX_TOKEN_URL = 'https://api.dropboxapi.com/oauth2/token';
const DBX_RPC = 'https://api.dropboxapi.com/2/';
const DBX_CONTENT = 'https://content.dropboxapi.com/2/';
const DBX_FOLDER = '/Certificate Registry Backups';
const DBX_MAX_UPLOAD = 140 * 1024 * 1024; // Dropbox's single-request upload limit is 150 MB
const DBX_NETWORK_MSG = "Couldn't reach Dropbox. Check your internet connection and try again.";

class DropboxError extends Error{
  constructor(kind, message){ super(message); this.kind = kind; }
}

function base64Url(bytes){
  let s = '';
  for(let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function randomToken(byteLen){
  const a = new Uint8Array(byteLen);
  crypto.getRandomValues(a);
  return base64Url(a);
}
async function pkceChallenge(verifier){
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return base64Url(new Uint8Array(digest));
}
function currentRedirectUri(){ return window.location.origin + window.location.pathname; }
function dropboxHeaderJson(obj){
  // Dropbox-API-Arg travels in an HTTP header, so non-ASCII characters must be \u-escaped.
  return JSON.stringify(obj).replace(/[\u007f-\uffff]/g, c => '\\u' + ('0000' + c.charCodeAt(0).toString(16)).slice(-4));
}

/* ---------- Connecting ---------- */
async function startDropboxConnect(appKey){
  const verifier = randomToken(64); // 86 characters, inside PKCE's 43–128 limit
  const challenge = await pkceChallenge(verifier);
  const stateToken = randomToken(24);
  const redirectUri = currentRedirectUri();
  const saved = await setJSON('__dbx_pending', {verifier, state: stateToken, appKey, redirectUri, startedAt: Date.now()});
  if(!saved) throw new Error('Could not save the sign-in details.');
  await setJSON('__dbx_appkey', appKey);
  const params = new URLSearchParams({
    client_id: appKey,
    response_type: 'code',
    code_challenge: challenge,
    code_challenge_method: 'S256',
    redirect_uri: redirectUri,
    token_access_type: 'offline',
    state: stateToken,
  });
  window.location.href = DBX_AUTH_URL + '?' + params.toString();
}

// Runs once at startup: if Dropbox just sent the user back with ?code=..., finish the sign-in.
async function handleDropboxRedirect(){
  const params = new URLSearchParams(window.location.search || '');
  if(!params.has('code') && !params.has('error')) return null;
  const code = params.get('code');
  const stateParam = params.get('state');
  const errParam = params.get('error');
  const errDesc = params.get('error_description');
  try{ window.history.replaceState(null, '', window.location.pathname); }catch(e){ /* cosmetic only */ }

  const pending = await getJSON('__dbx_pending', null);
  await deleteKeySafe('__dbx_pending');

  if(errParam){
    return {ok: false, message: errParam === 'access_denied'
      ? 'Dropbox access was not approved, so nothing was connected.'
      : `Dropbox sign-in failed${errDesc ? ': ' + errDesc : '.'}`};
  }
  if(!pending || !stateParam || pending.state !== stateParam){
    return {ok: false, message: 'That Dropbox sign-in could not be verified (it may have timed out). Click Connect Dropbox and try again.'};
  }
  try{
    const res = await fetch(DBX_TOKEN_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: new URLSearchParams({
        code, grant_type: 'authorization_code', client_id: pending.appKey,
        redirect_uri: pending.redirectUri, code_verifier: pending.verifier,
      }).toString(),
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok || !data.access_token){
      return {ok: false, message: "Dropbox didn't accept the connection" + (data.error_description ? `: ${data.error_description}` : '.') + ' Check the App key and Redirect URI in your Dropbox app, then try again.'};
    }
    const saved = await setJSON('__dbx_auth', {
      appKey: pending.appKey,
      accessToken: data.access_token,
      refreshToken: data.refresh_token || null,
      expiresAt: Date.now() + (Number(data.expires_in) || 14400) * 1000 - 60000,
    });
    if(!saved) return {ok: false, message: "Connected to Dropbox, but the connection couldn't be saved on this computer. Please try again."};
    return {ok: true};
  }catch(e){
    return {ok: false, message: "Couldn't reach Dropbox to finish connecting. Check your internet connection and try again."};
  }
}

function openDropboxSetupModal(){
  captureProfileDraft();
  state.modal = {type: 'dropboxSetup', appKey: (state.dropbox && state.dropbox.appKey) || '', error: ''};
  render();
}
async function submitDropboxSetup(){
  const el = document.getElementById('dbx_appkey');
  const key = el ? el.value.trim() : '';

    state.modal.error = "Paste the App key from your Dropbox app's Settings tab — a short run of letters and numbers.";
    render();

  }
  try{ await startDropboxConnect(key); }
  catch(e){
    console.error('Dropbox connect failed to start', e);
    if(state.modal && state.modal.type === 'dropboxSetup'){ state.modal.error = "Couldn't start the Dropbox sign-in. Please try again."; render(); }
  }
}
async function connectDropboxWithSavedKey(){
  const key = state.dropbox && state.dropbox.appKey;
  if(!key){ openDropboxSetupModal(); return; }
  try{ await startDropboxConnect(key); }
  catch(e){ console.error(e); setBackupMessage('error', "Couldn't start the Dropbox sign-in. Please try again."); }
}
function copyRedirectUri(){
  const uri = currentRedirectUri();
  const selectIt = () => { const el = document.getElementById('dbx_redirect'); if(el){ el.focus(); el.select(); } };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(uri).then(() => {

      if(b) b.textContent = 'Copied';
    }, selectIt);
  } else { selectIt(); }
}
async function disconnectDropbox(){
  if(state.backupBusy) return;
  const auth = await getJSON('__dbx_auth', null);
  await deleteKeySafe('__dbx_auth');
  state.dropbox = {connected: false, appKey: (state.dropbox && state.dropbox.appKey) || ''};
  if(auth && auth.accessToken){
    // Best effort: also tell Dropbox to invalidate the token. Failure here doesn't matter.
    try{ await fetch(DBX_RPC + 'auth/token/revoke', {method: 'POST', headers: {'Authorization': 'Bearer ' + auth.accessToken}}); }catch(e){ /* ignore */ }
  }
  setBackupMessage('ok', 'Dropbox disconnected. Your backups already in Dropbox are untouched.');
}

/* ---------- Tokens & requests ---------- */
async function dropboxForgetAuth(){
  await deleteKeySafe('__dbx_auth');
  state.dropbox = {connected: false, appKey: (state.dropbox && state.dropbox.appKey) || ''};
}
async function refreshDropboxToken(){
  const auth = await getJSON('__dbx_auth', null);
  if(!auth || !auth.refreshToken){
    await dropboxForgetAuth();
    throw new DropboxError('expired', 'Your Dropbox connection has expired. Click Connect Dropbox to sign in again.');
  }
  let res;
  try{
    res = await fetch(DBX_TOKEN_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: new URLSearchParams({grant_type: 'refresh_token', refresh_token: auth.refreshToken, client_id: auth.appKey}).toString(),
    });
  }catch(e){ throw new DropboxError('network', DBX_NETWORK_MSG); }
  const data = await res.json().catch(() => ({}));
  if(!res.ok || !data.access_token){
    if(res.status === 400 || res.status === 401){
      await dropboxForgetAuth();
      throw new DropboxError('expired', 'Your Dropbox connection has expired or was removed. Click Connect Dropbox to sign in again.');
    }
    throw new DropboxError('api', 'Dropbox could not renew the connection right now. Please try again in a moment.');
  }
  auth.accessToken = data.access_token;
  auth.expiresAt = Date.now() + (Number(data.expires_in) || 14400) * 1000 - 60000;
  await setJSON('__dbx_auth', auth);
  return auth.accessToken;
}
async function getDropboxAccessToken(){
  const auth = await getJSON('__dbx_auth', null);
  if(!auth) throw new DropboxError('not-connected', 'Dropbox is not connected yet.');
  if(auth.accessToken && Date.now() < auth.expiresAt) return auth.accessToken;
  return await refreshDropboxToken();
}
async function dropboxErrorFrom(res){
  let text = '', body = null;
  try{ text = await res.text(); body = JSON.parse(text); }catch(_){ /* not JSON */ }
  const summary = (body && typeof body.error_summary === 'string') ? body.error_summary : '';
  const tag = (body && isPlainObject(body.error)) ? body.error['.tag'] : '';
  if(res.status === 401){
    if(tag === 'missing_scope' || /missing_scope/.test(summary)){
      return new DropboxError('missing-scope', "Your Dropbox app doesn't have the right permissions. In the Dropbox App Console, open your app's Permissions tab, tick files.content.write and files.content.read, click Submit, then Disconnect and Connect Dropbox again here.");
    }
    return new DropboxError('expired', 'Your Dropbox connection has expired. Click Connect Dropbox to sign in again.');
  }
  if(res.status === 429) return new DropboxError('rate-limit', 'Dropbox is asking us to slow down. Wait a minute and try again.');
  if(res.status === 409){
    if(/not_found/.test(summary)) return new DropboxError('not-found', 'That file or folder was not found in Dropbox.');
    if(/insufficient_space/.test(summary)) return new DropboxError('insufficient-space', 'Your Dropbox is full, so the backup could not be saved.');
    return new DropboxError('api', 'Dropbox could not complete that (' + (summary || 'unknown reason') + ').');
  }
  return new DropboxError('api', `Dropbox returned an error (${res.status}).` + (!body && text ? ' ' + text.slice(0, 160) : ''));
}
async function dropboxRequest(url, makeInit, allowRetry = true){
  const token = await getDropboxAccessToken();
  let res;
  try{ res = await fetch(url, makeInit(token)); }
  catch(e){ throw new DropboxError('network', DBX_NETWORK_MSG); }
  if(res.ok) return res;
  const err = await dropboxErrorFrom(res);
  if(err.kind === 'expired'){
    if(allowRetry){
      await refreshDropboxToken();             // throws 'expired' itself if it can't renew
      return dropboxRequest(url, makeInit, false);
    }
    await dropboxForgetAuth();
  }
  throw err;
}

/* ---------- Upload / list / download ---------- */
async function dropboxUpload(filename, blob){
  if(blob.size > DBX_MAX_UPLOAD) throw new DropboxError('too-large', 'This backup is bigger than Dropbox allows in one upload. Use "Download to this Mac" instead.');
  const arg = {path: `${DBX_FOLDER}/${filename}`, mode: 'add', autorename: true, mute: true};
  const res = await dropboxRequest(DBX_CONTENT + 'files/upload', token => ({
    method: 'POST',
    headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/octet-stream', 'Dropbox-API-Arg': dropboxHeaderJson(arg)},
    body: blob,
  }));
  return await res.json();
}
async function dropboxListBackups(){
  const rpc = body => token => ({
    method: 'POST',
    headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  let data;
  try{
    const res = await dropboxRequest(DBX_RPC + 'files/list_folder', rpc({path: DBX_FOLDER, limit: 500}));
    data = await res.json();
  }catch(err){
    if(err instanceof DropboxError && err.kind === 'not-found') return []; // no backups saved yet
    throw err;
  }
  let entries = data.entries || [];
  let guard = 0;
  while(data.has_more && guard++ < 20){
    const res = await dropboxRequest(DBX_RPC + 'files/list_folder/continue', rpc({cursor: data.cursor}));
    data = await res.json();
    entries = entries.concat(data.entries || []);
  }
  return entries
    .filter(e => e['.tag'] === 'file' && /\.json$/i.test(e.name))
    .sort((a, b) => String(b.server_modified).localeCompare(String(a.server_modified)))
    .slice(0, 50);
}
async function dropboxDownloadText(path){
  const res = await dropboxRequest(DBX_CONTENT + 'files/download', token => ({
    method: 'POST',
    headers: {'Authorization': 'Bearer ' + token, 'Dropbox-API-Arg': dropboxHeaderJson({path})},
  }));
  return await res.text();
}

/* ---------- Actions behind the buttons ---------- */
function describeDropboxFailure(err){
  return err instanceof DropboxError ? err.message : "Something went wrong talking to Dropbox. Please try again.";
}
async function saveBackupToDropbox(){
  if(state.backupBusy) return;
  if(!state.dropbox.connected){ openDropboxSetupModal(); return; }
  if(isRegistryEmpty()){ setBackupMessage('error', 'There is nothing to back up yet — add a certificate or fill in your profile first.'); return; }
  state.backupMessage = null;
  setBackupBusy('Preparing backup…');
  try{
    const {payload, included, missing} = await buildBackupPayload();
    const blob = new Blob([JSON.stringify(payload)], {type: 'application/octet-stream'});
    setBackupBusy(`Uploading ${formatBytes(blob.size)} to Dropbox…`);
    const meta = await dropboxUpload(backupFileName(), blob);
    if(meta && typeof meta.size === 'number' && meta.size !== blob.size){
      throw new DropboxError('api', 'Dropbox received a different amount of data than was sent, so the backup may be incomplete. Please try again.');
    }
    const savedName = (meta && meta.name) || backupFileName();
    await recordBackup('Dropbox', savedName, payload.counts);
    setBackupMessage('ok',
      `Saved to Dropbox as ${savedName} with ${plural(payload.counts.certificates, 'certificate')} and ${plural(included, 'PDF file')} (${formatBytes(blob.size)}).` +
      (missing ? ` ${plural(missing, 'PDF file')} could not be read and ${missing === 1 ? 'is' : 'are'} not included.` : ''));
  }catch(err){
    console.error('Dropbox save failed', err);
    setBackupMessage('error', describeDropboxFailure(err));
  }
}
async function openDropboxRestoreList(){
  if(state.backupBusy) return;
  if(!state.dropbox.connected){ openDropboxSetupModal(); return; }
  captureProfileDraft();
  const modal = {type: 'dropboxList', loading: true, items: [], error: '', downloading: false};
  state.modal = modal;
  render();
  try{
    const items = await dropboxListBackups();
    if(state.modal !== modal) return; // user closed it meanwhile
    modal.items = items;
    modal.loading = false;
    render();
  }catch(err){
    console.error('Dropbox list failed', err);
    if(state.modal !== modal) return;
    modal.loading = false;
    modal.error = describeDropboxFailure(err);
    render();
  }
}
async function restoreFromDropboxItem(index){
  const modal = state.modal;
  if(!modal || modal.type !== 'dropboxList' || modal.downloading) return;
  const item = modal.items[index];
  if(!item) return;
  modal.downloading = true;
  modal.error = '';
  render();
  try{
    const text = await dropboxDownloadText(item.path_lower || item.path_display);
    if(state.modal !== modal) return;
    state.modal = null;
    prepareRestore(text, `Dropbox (${item.name})`);
  }catch(err){
    console.error('Dropbox download failed', err);
    if(state.modal !== modal) return;
    modal.downloading = false;
    modal.error = describeDropboxFailure(err);
    render();
  }
}
